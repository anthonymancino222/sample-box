<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample Box Tracker</title>
<script>try{var th=localStorage.getItem('sampleBoxTracker.theme');if(!th)th=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=th;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Grand library, lit for the future: parchment by day, candlelit reading room by night */
:root{
  color-scheme:light;
  --bg:#f1e9d6;--bg2:#e9dfc6;--card:#fbf6ea;--card2:#f6eedb;
  --ink:#2a2018;--mute:#7b6a55;--line:#d9c9a8;--line2:#c9b68f;
  --accent:#7a5a28;--accent-ink:#fffaf0;--accent2:#2f5b4e;--glow:rgba(122,90,40,.10);
  --ok:#55805f;--warn:#b27a1c;--hot:#a5442e;
  --okbg:#e2ecd9;--warnbg:#f5e5be;--hotbg:#f2d9cf;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 6px 18px rgba(80,55,20,.10);
  --serif:'Cormorant Garamond','EB Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'JetBrains Mono',Consolas,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14110e;--bg2:#1a1510;--card:#1f1913;--card2:#251e16;
  --ink:#eee2c9;--mute:#a69581;--line:#3a2f23;--line2:#52422f;
  --accent:#d9ad5f;--accent-ink:#1c150b;--accent2:#7fb09c;--glow:rgba(217,173,95,.10);
  --ok:#8db798;--warn:#e0b25a;--hot:#dc8570;
  --okbg:#1d2c24;--warnbg:#35290f;--hotbg:#3b1f18;
  --shadow:0 1px 0 rgba(255,235,190,.05) inset,0 8px 22px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){--bg:#14110e;--bg2:#1a1510;--card:#1f1913;--card2:#251e16;--ink:#eee2c9;--mute:#a69581;--line:#3a2f23;--line2:#52422f;--accent:#d9ad5f;--accent-ink:#1c150b;--accent2:#7fb09c;--glow:rgba(217,173,95,.10);--ok:#8db798;--warn:#e0b25a;--hot:#dc8570;--okbg:#1d2c24;--warnbg:#35290f;--hotbg:#3b1f18;color-scheme:dark}
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.55 var(--sans);
  background:
   radial-gradient(1100px 520px at 50% -140px,var(--glow),transparent 70%),
   linear-gradient(var(--bg),var(--bg2)) fixed;
  min-height:100vh;transition:background .5s,color .4s}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

/* ---- hero ---- */
.hero{text-align:center;position:relative;padding:18px 0 8px}
.hero .tools{position:absolute;right:0;top:6px;display:flex;gap:8px}
.hero h1{font:600 clamp(30px,5vw,46px)/1.1 var(--serif);letter-spacing:.02em;margin:6px 0 4px}
.hero .tagline{font:italic 500 18px/1.4 var(--serif);color:var(--mute);margin:0}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--accent);margin:2px auto 0;max-width:340px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.orn svg{width:26px;height:26px}
.status{margin-top:10px;font-size:12px;color:var(--mute);display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.sub{color:var(--mute);font-size:13px}

/* ---- drop zone ---- */
#drop{margin:22px 0;border:1.5px dashed var(--line2);border-radius:14px;padding:20px 18px;text-align:center;
  background:var(--card);cursor:pointer;color:var(--mute);box-shadow:var(--shadow);transition:all .35s ease;font-size:14px}
#drop:hover{border-color:var(--accent)}
#drop.over{border-color:var(--accent);background:var(--card2);box-shadow:0 0 0 4px var(--glow)}
#drop b{color:var(--accent);font:600 19px var(--serif)}

/* ---- tiles & panels ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center;box-shadow:var(--shadow)}
.tile .n{font:600 40px/1 var(--serif);color:var(--accent)}
.tile .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow);position:relative}
.panel::before{content:"";position:absolute;inset:4px;border:1px solid var(--line);border-radius:10px;pointer-events:none;opacity:.55}
.panel h2{font:600 24px var(--serif);margin:0 0 8px;letter-spacing:.01em}
.sug{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.sug:first-of-type{border-top:0}

/* ---- controls ---- */
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;transition:border-color .25s,background .25s,box-shadow .25s}
input:focus,select:focus,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
button{cursor:pointer}
button:hover{border-color:var(--accent);background:var(--card2)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;letter-spacing:.02em}
button.pri:hover{filter:brightness(1.07);background:var(--accent)}
button.icon,.hero .tools button{border-radius:99px;padding:6px 14px;font-size:13px;background:transparent}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
#q{flex:1;min-width:220px;background:var(--card);font-family:var(--serif);font-size:18px;padding:9px 16px}
#q::placeholder{font-style:italic;color:var(--mute)}

/* ---- box cards: little catalogue drawers ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.box{background:linear-gradient(var(--card),var(--card2));border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;cursor:pointer;
  box-shadow:var(--shadow);position:relative;transition:transform .35s ease,border-color .3s,box-shadow .35s}
.box::after{content:"";position:absolute;inset:3px;border:1px solid var(--line);border-radius:9px;opacity:.45;pointer-events:none}
.box:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 26px var(--glow),var(--shadow)}
.box .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box .t b{font:600 23px/1 var(--serif);letter-spacing:.02em;padding:4px 12px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink)}
.pill{font-size:11px;letter-spacing:.06em;padding:2px 10px;border-radius:99px;background:transparent;color:var(--mute);border:1px solid var(--line2)}
.pill.off{background:var(--warnbg);color:var(--warn);border-color:transparent}
.meter{height:7px;border-radius:99px;background:var(--bg);margin:14px 0 8px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:99px;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.f-ok{background:var(--ok)}.f-low{background:var(--warn)}.f-hot{background:var(--hot)}
.meta{font:13px var(--mono);color:var(--mute);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.tag.merge{background:var(--warnbg);color:var(--warn)}.tag.full{background:var(--hotbg);color:var(--hot)}

/* ---- dialog ---- */
dialog{border:1px solid var(--line2);border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(780px,96vw);max-height:90vh;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,14,8,.5);backdrop-filter:blur(5px)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card2);border-radius:16px 16px 0 0}
.dh h3{margin:0;flex:1;font:600 26px var(--serif);letter-spacing:.01em}
.db{padding:8px 20px 20px;overflow-y:auto;overflow-x:hidden;max-height:68vh}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
td{font-family:var(--mono);font-size:13px}
tr.pulled td{opacity:.45;text-decoration:line-through}
td.np{font-family:var(--sans)}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
details{margin-top:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
summary{cursor:pointer;color:var(--ink);font-size:15px;padding:6px 0}
summary b{font:600 19px var(--serif)}
summary::marker{color:var(--accent)}
.msg{padding:12px 14px;border-radius:10px;background:var(--hotbg);color:var(--hot);margin-bottom:14px;display:none}
.empty{text-align:center;color:var(--mute);padding:36px;font:italic 20px var(--serif)}
@media(max-width:560px){.wrap{padding:14px 12px 40px}.hero .tools{position:static;justify-content:center;margin-bottom:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="tools"><button id="themeBtn" title="Switch light / dark">Dark</button><button id="helpBtn" title="How to use this app">? Help / FAQ</button></div>
    <div class="orn"><i></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 3l2.2 6.8H21l-5.5 4 2.1 6.7L12 16.6 6.4 20.5l2.1-6.7L3 9.8h6.8z" stroke-linejoin="round"/></svg><i></i></div>
    <h1>Sample Box Tracker</h1>
    <p class="tagline">Every reference sample, kept in its place.</p>
    <div class="status"><span id="stamp"></span> <b id="sync" class="pill"></b></div>
  </header>

  <div id="drop"><b>Drop the sample sheet here</b> (.xlsx / .csv) or click to choose. Only Timestamp, Job_Number, Inventory_Item and Sample Location are read &mdash; everything else is ignored.
    <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden></div>
  <div id="err" class="msg"></div>

  <div id="app" hidden>
    <div class="tiles" id="tiles"></div>

    <div class="panel" id="mergePanel"></div>

    <div class="bar">
      <input id="q" type="search" placeholder="Find an item # or job # (e.g. 115403) &rarr; which box?">
      <select id="filter">
        <option value="all">All boxes</option>
        <option value="Main">Main location</option>
        <option value="Overflow">Overflow location</option>
        <option value="open">Not full</option>
        <option value="full">Full</option>
        <option value="merge">Can be consolidated</option>
      </select>
      <select id="sort">
        <option value="num">Sort: box #</option>
        <option value="fill">Sort: emptiest first</option>
      </select>
      <button id="addBtn" class="pri">+ Add sample</button>
      <button id="mergeBtn">Merge / renumber boxes</button>
      <button id="settings">Settings</button>
    </div>
    <div id="search" class="panel" hidden></div>
    <div class="grid" id="grid"></div>

    <details id="ignored"><summary></summary><div id="ignoredList" class="sub" style="margin-top:6px"></div></details>
  </div>
</div>

<datalist id="boxlist"></datalist>
<dialog id="dlg"><div class="dh"><h3 id="dt"></h3><span id="dctl"></span><button id="dclose">Close</button></div><div class="db" id="dbody"></div></dialog>

<script>
"use strict";
const LS = 'sampleBoxTracker.v1';
let state = load();           // {cap:100, boxMeta:{id:{loc,cap}}, pulled:{rowKey:1}, rows:[...], stamp}
function load(){ try{ const s=JSON.parse(localStorage.getItem(LS)); if(s&&s.rows){ s.manual=s.manual||[]; s.moves=s.moves||[]; return s; } }catch(e){} return {cap:100,boxMeta:{},pulled:{},manual:[],moves:[],rows:[],stamp:null}; }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }

/* ---------- shared backend (Google Apps Script + Google Sheet) ----------
   Leave BACKEND_URL empty to run local-only. Every change is queued in an outbox, sent as one small
   idempotent write, and the page re-reads the shared data only when the server's version number moved.
   Idle polling is a tiny {v} reply (no sheet is opened server-side), at most once every 2 minutes per open tab. */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwHG1fcnBDV5GWbEc--WLKuvC9GyyIYHSTUvbPWsJDCvUsEeOvd_jeK5KSBGA70OMBE/exec';
const OB = 'sampleBoxTracker.outbox';
let outbox = (()=>{ try{ return JSON.parse(localStorage.getItem(OB))||[]; }catch(e){ return []; } })();
let flushing=false, polling=false, lastSync=null, syncErr=null;
const saveOutbox=()=>{ try{ localStorage.setItem(OB, JSON.stringify(outbox)); }catch(e){} };
function op(o){ if(!BACKEND_URL) return; outbox.push(o); saveOutbox(); showSync(); flush(); }
const opMeta=box=>op({op:'setMeta',box,meta:state.boxMeta[box]||null});
const opPull=k=>op({op:'setPull',pull:Object.assign({k},state.pulled[k])});
async function flush(){
  if(!BACKEND_URL||flushing||!outbox.length) return;
  flushing=true;
  const batch=outbox.slice();
  try{
    // text/plain keeps this a "simple" CORS request (no preflight), which Apps Script requires
    const r=await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({ops:batch})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'server error');
    outbox=outbox.slice(batch.length); saveOutbox(); syncErr=null;
    if(state.v!=null && j.v===state.v+1) state.v=j.v;   // nobody else wrote in between: no refetch needed
    lastSync=Date.now(); save();
  }catch(e){ syncErr=String(e.message||e); setTimeout(flush,15000); }
  flushing=false; showSync();
  if(outbox.length&&!syncErr) flush();
}
async function poll(force){
  if(!BACKEND_URL||polling) return;
  if(outbox.length){ await flush(); if(outbox.length) return; }   // never overwrite our own unsent changes
  polling=true;
  try{
    const r=await fetch(BACKEND_URL+'?since='+(force?'':(state.v==null?'':state.v)));
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'server error');
    if(!j.unchanged && j.state){
      const s=j.state;
      state.cap=s.cap; state.stamp=s.stamp; state.ignored=s.ignored; state.boxMeta=s.boxMeta; state.pulled=s.pulled;
      state.rows=s.rows; state.manual=s.manual; state.moves=s.moves||[]; state.v=j.v; save();
      const dlg=$('dlg');
      render();
      if(dlg.open && curBox && !dlg.contains(document.activeElement)) openBox(curBox);
    } else { state.v=j.v; }
    lastSync=Date.now(); syncErr=null;
  }catch(e){ syncErr=String(e.message||e); }
  polling=false; showSync();
}
function showSync(){
  const el=document.getElementById('sync'); if(!el) return;
  if(!BACKEND_URL){ el.textContent='Local only (not shared)'; return; }
  el.textContent = syncErr ? `⚠ Offline – ${outbox.length} change${outbox.length==1?'':'s'} waiting` :
    outbox.length ? 'Saving…' : lastSync ? 'Shared · synced '+new Date(lastSync).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : 'Connecting…';
}
let curBox=null;

/* ---------- location normalizer: messy free text -> box id or null ---------- */
function normLoc(raw){
  const t = String(raw==null?'':raw).trim();
  if(!t) return {blank:true};
  let m;
  if(/calchef/i.test(t)){
    const rest = t.replace(/calchef/ig,'').replace(/\bbox\b/ig,' ');
    if(m = rest.match(/\d+/)) return {box:'Calchef '+parseInt(m[0],10), series:'Calchef'};
    if(m = rest.match(/(^|[^a-z])([a-d])([^a-z]|$)/i)) return {box:'Calchef '+m[2].toUpperCase(), series:'Calchef'};
    return {text:t};
  }
  if(m = t.match(/^(?:box|bx|bo|b0x|nx|bxe)\s*#?\s*(\d+)$/i)) return {box:'Box '+parseInt(m[1],10)};
  if(/^boxll$/i.test(t)) return {box:'Box 11'};
  if(m = t.match(/^(?:box|bx)\s*([a-z])$/i)) return {box:'Box '+m[1].toUpperCase()};
  if(/^\d{1,3}$/.test(t)) return {box:'Box '+parseInt(t,10)};
  if(/^b8$/i.test(t)) return {box:'Box 8'};
  return {text:t};
}

/* ---------- import ---------- */
function excelDate(v){
  if(v instanceof Date) return v;
  if(typeof v==='number') return new Date(Math.round((v-25569)*86400000));
  const d=new Date(v); return isNaN(d)?null:d;
}
function findCol(hdr, names){
  const norm = s=>String(s).toLowerCase().replace(/[^a-z]/g,'');
  for(let i=0;i<hdr.length;i++) if(names.includes(norm(hdr[i]))) return i;
  return -1;
}
function ingest(aoa){
  // find header row (within the first 10 rows)
  let hi=-1, c;
  for(let r=0;r<Math.min(10,aoa.length);r++){
    const loc=findCol(aoa[r],['samplelocation','location']);
    if(loc>=0){ hi=r; break; }
  }
  if(hi<0) throw new Error('Could not find a "Sample Location" column. Make sure the copied sheet has headers: Timestamp, Job_Number, Inventory_Item, Sample Location.');
  const h=aoa[hi];
  c={ts:findCol(h,['timestamp','date']), job:findCol(h,['jobnumber','job']), item:findCol(h,['inventoryitem','item','productid']), loc:findCol(h,['samplelocation','location'])};
  const rows=[], seen=new Set(), ignored={};
  for(let r=hi+1;r<aoa.length;r++){
    const a=aoa[r]; if(!a) continue;
    const n=normLoc(a[c.loc]);
    if(n.blank) continue;                       // no sample kept for this job
    if(!n.box){ ignored[n.text]=(ignored[n.text]||0)+1; continue; }   // e.g. "Given to Johana", "1st pass"
    const d=c.ts>=0?excelDate(a[c.ts]):null;
    const job=String(a[c.job]==null?'':a[c.job]).replace(/\.0$/,'').trim();
    let item=String(a[c.item]==null?'':a[c.item]).replace(/\.0$/,'').trim(); if(item==='0') item='';
    const key=(d?d.getTime():'')+'|'+job+'|'+item+'|'+n.box;
    if(seen.has(key)) continue; seen.add(key);
    rows.push({k:(d?d.getTime():'')+'|'+job+'|'+item, box:n.box, series:n.series||'Box', ts:d?d.getTime():null, job, item});
  }
  if(!rows.length) throw new Error('No sample boxes found in that file, so nothing was changed.');
  if(BACKEND_URL && state.rows.length && !confirm(`This replaces the shared sample data for everyone with ${rows.length} rows from this file. Continue?`)) return;
  state.rows=rows; state.ignored=ignored; state.stamp=Date.now();
  // The sheet is the source of truth: drop pulls whose row is gone or now sits in a different box
  // (you relabeled it in the sheet), and manual entries the sheet now already contains.
  const live=new Map(rows.map(x=>[x.k,x]));
  for(const k in state.pulled){ if(k.includes('>')) continue; const p=state.pulled[k]; const r=live.get(k)||state.manual.find(x=>x.k===k); if(!r||(p.from&&resolveBox(p.from,null,p.at)!==resolveBox(r.box,r.ts))) delete state.pulled[k]; }
  // pulls on "moved in" copies (key = parentKey>Box) only live as long as their parent pull still points there
  for(const k in state.pulled){ if(!k.includes('>')) continue; const pk=k.slice(0,k.lastIndexOf('>')), par=state.pulled[pk], dest=k.slice(k.lastIndexOf('>')+1);
    if(!par||normLoc(par.to).box!==dest) delete state.pulled[k]; }
  const have=new Set(rows.filter(r=>r.item).map(r=>r.item+'|'+r.job+'|'+resolveBox(r.box,r.ts)));
  state.manual=state.manual.filter(x=>!(x.item&&have.has(x.item+'|'+x.job+'|'+resolveBox(x.box,x.ts))));
  save(); render();
  op({op:'import',rows,ignored,stamp:state.stamp,
      pulled:Object.keys(state.pulled).map(k=>Object.assign({k},state.pulled[k])), manual:state.manual});
}
async function readFile(f){
  const err=document.getElementById('err'); err.style.display='none';
  try{
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    // use the first sheet that has a Sample Location header
    let aoa=null;
    for(const name of wb.SheetNames){
      const t=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
      if(t.slice(0,10).some(r=>findCol(r,['samplelocation','location'])>=0)){ aoa=t; break; }
    }
    if(!aoa) throw new Error('No sheet with a "Sample Location" column was found in that file.');
    ingest(aoa);
  }catch(e){ err.textContent=e.message; err.style.display='block'; }
}

/* ---------- model ---------- */
const meta=id=>state.boxMeta[id]||(state.boxMeta[id]={});
const capOf=id=>meta(id).cap||state.cap;
const locOf=id=>meta(id).loc||'Main';
const isPulled=r=>!!state.pulled[r.k];
// Every sample row currently known: sheet rows + manual entries, plus a "moved in" copy
// in the destination box for each pulled sample that was given a new box.
// Box renumbers / merges are stored as moves {from,to,at}. A sample recorded as `from` on or before `at`
// now lives in `to`; samples recorded later under the old number are a new physical box and stay put.
function resolveBox(box,ts,minAt){
  let b=box;
  for(const m of state.moves){ if(m.from===b && (minAt!=null ? m.at>minAt : (ts==null||ts<=m.at))) b=m.to; }
  return b;
}
const seriesOf=b=>normLoc(b).series||'Box';
function disp(r){ const b=resolveBox(r.box,r.ts); return b===r.box?r:Object.assign({},r,{box:b,series:seriesOf(b)}); }
function effRows(){
  const out=[];
  const walk=(r,depth)=>{
    out.push(r);
    const p=state.pulled[r.k];
    if(!p||!p.to||depth>5) return;
    if(p.from&&resolveBox(p.from,null,p.at)!==r.box) return;
    const n=normLoc(p.to); if(!n.box) return;              // "Given to Johana" etc: just leaves the boxes
    const db=resolveBox(n.box,null,p.at);
    walk({k:r.k+'>'+n.box,box:db,series:seriesOf(db),ts:p.at||r.ts,job:r.job,item:r.item,from:r.box},depth+1);
  };
  state.rows.concat(state.manual).forEach(r=>walk(disp(r),0));
  return out;
}
function boxes(){
  const m={};
  for(const r of effRows()){ const b=m[r.box]||(m[r.box]={id:r.box,series:r.series,rows:[],left:0}); b.rows.push(r); if(!isPulled(r)) b.left++; }
  const list=Object.values(m);
  list.forEach(b=>{ const mt=meta(b.id); b.cap=capOf(b.id); b.loc=locOf(b.id); b.full=b.left>=b.cap; b.pct=b.left/b.cap; b.num=parseInt(b.id.replace(/\D/g,''),10)||999; });
  return list.filter(b=>b.left>0);   // boxes with nothing left are retired
}
function suggestions(list){
  // greedy: smallest box moves into the fullest box that can still hold it (prefer same location)
  const used=new Set(), out=[];
  const asc=[...list].sort((a,b)=>a.left-b.left);
  for(const a of asc){
    if(used.has(a.id)) continue;
    const cands=list.filter(b=>b.id!==a.id && !used.has(b.id) && b.series===a.series && a.left+b.left<=b.cap)
      .sort((x,y)=>(y.loc===a.loc)-(x.loc===a.loc) || y.left-x.left);
    if(!cands.length) continue;
    const t=cands[0]; used.add(a.id); used.add(t.id);
    out.push({from:a,to:t,total:a.left+t.left});
  }
  return out;
}

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=ts=>ts?new Date(ts).toLocaleDateString(undefined,{year:'2-digit',month:'short',day:'numeric'}):'—';
function fillClass(p){return p>=0.9?'f-hot':p<=0.5?'f-low':'f-ok';}
function render(){
  const has=state.rows.length>0||state.manual.length>0;
  $('app').hidden=!has;
  $('stamp').textContent=state.stamp?' Data loaded '+new Date(state.stamp).toLocaleString()+'.':'';
  if(!has) return;
  const list=boxes(), sug=suggestions(list);
  const mergeable=new Set(); sug.forEach(s=>{mergeable.add(s.from.id);});
  const total=list.reduce((a,b)=>a+b.left,0), over=list.filter(b=>b.loc==='Overflow').length;
  $('tiles').innerHTML=[
    [list.length,'active boxes'],[total,'samples on hand'],[over,'in overflow location'],[sug.length,'merges possible'],
  ].map(([n,l])=>`<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  $('mergePanel').innerHTML = `<h2>Consolidation suggestions</h2>` + (sug.length ? sug.map(s=>`
    <div class="sug"><span><b>${esc(s.from.id)}</b> (${s.from.left}${s.from.loc!=='Main'?', '+s.from.loc:''}) &rarr; <b>${esc(s.to.id)}</b> (${s.to.left}${s.to.loc!=='Main'?', '+s.to.loc:''})</span>
    <span class="sub">= ${s.total} of ${s.to.cap} after merge</span>
    <button data-open="${esc(s.from.id)}">See what moves</button> <button data-merge="${esc(s.from.id)}|${esc(s.to.id)}">Merge…</button></div>`).join('')
    : '<div class="sub">No two boxes fit together right now.</div>')
    + `<div class="sub" style="margin-top:6px">After combining, change those rows' Sample Location in the sheet to the surviving box and drop the sheet back in.</div>`;

  let v=list.filter(b=>{
    const f=$('filter').value;
    return f==='all' || (f==='merge'?mergeable.has(b.id):f==='full'?b.full:f==='open'?!b.full:b.loc===f);
  });
  v.sort($('sort').value==='fill'?(a,b)=>a.pct-b.pct:(a,b)=>a.series.localeCompare(b.series)||a.num-b.num);
  $('grid').innerHTML = v.length ? v.map(b=>`
    <div class="box" data-open="${esc(b.id)}">
      <div class="t"><b>${esc(b.id)}</b><span class="pill ${b.loc==='Overflow'?'off':''}">${esc(b.loc)}</span></div>
      <div class="meter"><i class="${fillClass(b.pct)}" style="width:${Math.min(100,Math.round(b.pct*100))}%"></i></div>
      <div class="meta"><span>${b.left} / ${b.cap}</span>
        ${b.full?'<span class="tag full">FULL</span>':mergeable.has(b.id)?'<span class="tag merge">merge candidate</span>':'<span>'+Math.round(b.pct*100)+'%</span>'}</div>
    </div>`).join('') : '<div class="empty">No boxes match.</div>';

  const ig=state.ignored||{}, ik=Object.keys(ig).sort((a,b)=>ig[b]-ig[a]);
  $('ignored').querySelector('summary').textContent=`Location entries ignored (not a box): ${ik.reduce((a,k)=>a+ig[k],0)} rows, ${ik.length} different texts`;
  $('ignoredList').textContent=ik.map(k=>`${k} (${ig[k]})`).join(' · ');
  $('boxlist').innerHTML=list.sort((a,b)=>a.series.localeCompare(b.series)||a.num-b.num).map(b=>`<option value="${esc(b.id)}">`).join('');
  runSearch();
}
function runSearch(){
  const q=$('q').value.trim(), p=$('search');
  if(!q){p.hidden=true;return;}
  const hit=effRows().filter(r=>!isPulled(r)&&(r.item===q||r.job===q||r.item.includes(q)&&q.length>=4));
  p.hidden=false;
  if(!hit.length){p.innerHTML=`<div class="sub">Nothing on hand matching “${esc(q)}”.</div>`;return;}
  const by={}; hit.forEach(r=>(by[r.box]=by[r.box]||[]).push(r));
  p.innerHTML=`<h2>“${esc(q)}” is in:</h2>`+Object.keys(by).map(b=>`<div class="sug"><b>${esc(b)}</b><span class="pill ${locOf(b)==='Overflow'?'off':''}">${locOf(b)}</span><span class="sub">${by[b].length} sample${by[b].length>1?'s':''} · item ${[...new Set(by[b].map(r=>r.item))].join(', ')} · job ${[...new Set(by[b].map(r=>r.job))].join(', ')}</span><button data-open="${esc(b)}">Open</button></div>`).join('');
}

/* ---------- box detail ---------- */
function openBox(id){
  curBox=id;
  const rows=effRows().filter(r=>r.box===id).sort((a,c)=>(c.ts||0)-(a.ts||0));
  const left=rows.filter(r=>!isPulled(r)).length, cap=capOf(id), isFull=left>=cap;
  $('dt').textContent=`${id} — ${left} of ${cap}${isFull?' (FULL)':''}`;
  $('dctl').innerHTML=`<select id="dloc"><option>Main</option><option>Overflow</option></select>
    <label class="sub">capacity <input id="dcap" type="number" min="1" style="width:70px" value="${cap}"></label>
    <button id="drename">Change number</button> <button id="dfull">${meta(id).full&&isFull?'Unmark full':'Mark as full'}</button> <button id="dadd">+ Add sample</button>`;
  $('dloc').value=locOf(id);
  $('dloc').onchange=e=>{meta(id).loc=e.target.value;save();opMeta(id);render();};
  $('dcap').onchange=e=>{const n=parseInt(e.target.value,10);if(n>0)meta(id).cap=n;else delete meta(id).cap;save();opMeta(id);render();openBox(id);};
  // Marking full pins this box's capacity at what it holds right now (boxes fill at different counts).
  $('dfull').onclick=()=>{ const m=meta(id); if(m.full&&isFull){delete m.full;delete m.cap;} else {m.full=true;m.cap=Math.max(1,left);} save();opMeta(id);render();openBox(id); };
  $('dadd').onclick=()=>openAdd(id);
  $('drename').onclick=()=>openMerge([id],id,true);
  const note=r=>{
    const p=state.pulled[r.k];
    if(p){ const to=p.to||''; const n=to?normLoc(to):{};
      return `<input data-to="${esc(r.k)}" list="boxlist" value="${esc(to)}" placeholder="Now at: pick a box or type where" style="width:100%;min-width:170px">${to&&!n.box?'<div class="sub">not a box – leaves the boxes</div>':''}`; }
    return (r.from?`<span class="pill">moved in from ${esc(r.from)}</span> `:'')+(r.manual?`<span class="pill">manual</span> <button data-del="${esc(r.k)}" title="Delete this manual entry">✕</button>`:'');
  };
  $('dbody').innerHTML=`<table><thead><tr><th>Pulled</th><th>Item #</th><th>Job #</th><th>Date</th><th>Location / note</th></tr></thead><tbody>`+
    rows.map(r=>`<tr class="${isPulled(r)?'pulled':''}"><td><input type="checkbox" data-pull="${esc(r.k)}" ${isPulled(r)?'checked':''}></td><td>${esc(r.item||'—')}</td><td>${esc(r.job||'—')}</td><td>${fdate(r.ts)}</td><td class="np">${note(r)}</td></tr>`).join('')+`</tbody></table>
    <div class="sub" style="margin-top:8px">Tick “Pulled” when a sample leaves this box, then say where it is now (an existing box, a new box you type, or leave blank if it's gone). “Mark as full” sets this box's capacity to what it holds right now.</div>`;
  if(!$('dlg').open) $('dlg').showModal();
  $('dbody').onchange=e=>{
    const t=e.target;
    if(t.dataset.pull!=null){
      if(t.checked){ state.pulled[t.dataset.pull]={from:id,to:'',at:Date.now()}; save(); opPull(t.dataset.pull); } else { delete state.pulled[t.dataset.pull]; save(); op({op:'clearPull',k:t.dataset.pull}); }
      render(); openBox(id);
      if(t.checked){ const i=$('dbody').querySelector(`[data-to="${CSS.escape(t.dataset.pull)}"]`); if(i) i.focus(); }
    } else if(t.dataset.to!=null){
      const p=state.pulled[t.dataset.to]; if(!p) return;
      const v=t.value.trim(), n=normLoc(v); p.to=n.box||v; save(); opPull(t.dataset.to); render(); openBox(id);
    }
  };
  $('dbody').onclick=e=>{ const k=e.target.dataset&&e.target.dataset.del; if(!k) return;
    if(confirm('Delete this manual entry?')){ state.manual=state.manual.filter(x=>x.k!==k); delete state.pulled[k]; save(); op({op:'delManual',k}); render(); openBox(id); } };
}

/* ---------- add a sample by hand ---------- */
function openAdd(preBox){

  $('dt').textContent='Settings'; $('dctl').innerHTML='';
  $('dbody').innerHTML=`<p>Default box capacity (samples): <input id="scap" type="number" min="1" value="${state.cap}" style="width:80px"></p>

  $('dbody').onchange=null;

  if(gs.length) $('dbody').insertAdjacentHTML('beforeend','<h4 style="font:600 20px var(--serif);margin:14px 0 4px">Recent box changes</h4>'+gs.map(x=>`<div class="sug"><span>${esc(x.txt)}</span><span class="sub">${new Date(x.at).toLocaleDateString()}</span><button data-undo="${x.g}">Undo</button></div>`).join(''));

  if($('sclear')) $('sclear').onclick=()=>{ if(confirm('Remove all imported data and pull marks from this device?')){state={cap:state.cap,boxMeta:state.boxMeta,pulled:{},manual:[],moves:[],rows:[],stamp:null};save();$('dlg').close();render();} };
  $('dlg').showModal();
}

/* ---------- change a box number / merge boxes ---------- */
const clone=o=>o==null?null:JSON.parse(JSON.stringify(o));
function applyMerge(froms,to,cap){
  const g='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), at=Date.now();
  const snap={}; [...froms,to].forEach(b=>{ snap[b]=clone(state.boxMeta[b]); });
  const tm=state.boxMeta[to]||{}, loc=tm.loc||froms.map(f=>(state.boxMeta[f]||{}).loc).find(Boolean);
  const nm={}; if(loc) nm.loc=loc; if(cap>0) nm.cap=cap;
  froms.forEach((f,i)=>{ const mv={g,from:f,to,at,snap:i===0?snap:null}; state.moves.push(mv); op({op:'addMove',move:mv}); });
  froms.forEach(f=>{ delete state.boxMeta[f]; opMeta(f); });
  if(Object.keys(nm).length) state.boxMeta[to]=nm; else delete state.boxMeta[to];
  save(); opMeta(to); render(); return g;
}
function undoMerge(g){
  const first=state.moves.find(m=>m.g===g&&m.snap); if(!first) return;
  state.moves=state.moves.filter(m=>m.g!==g); op({op:'delMoves',g});
  for(const b in first.snap){ if(first.snap[b]) state.boxMeta[b]=first.snap[b]; else delete state.boxMeta[b]; opMeta(b); }
  save(); render();
}
function openMerge(pre,result,focusResult){
  curBox=null; $('dbody').onchange=null; $('dbody').onclick=null;
  const list=boxes().sort((a,b)=>a.series.localeCompare(b.series)||a.num-b.num);
  const sel=new Set(pre||[]);
  $('dt').textContent='Change box number / merge boxes'; $('dctl').innerHTML='';
  $('dbody').innerHTML=`<p class="sub">Tick one box to <b>change its number</b>, or two or more to <b>merge them into one</b>. Then type the number the finished box should have (a new number, or one of the boxes). Nothing is lost: every sample moves with its box.</p>
   <input id="mfind" placeholder="Filter boxes…" style="width:100%;margin-bottom:8px">
   <div id="mlist" style="max-height:230px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--line);border-radius:10px;padding:6px 10px"></div>
   <div style="display:flex;gap:14px;flex-wrap:wrap;margin:12px 0"><label>Box number for the result<br><input id="mres" list="boxlist" value="${esc(result||'')}" placeholder="e.g. Box 31 or Box 42"></label><label>Capacity<br><input id="mcap" type="number" min="1" style="width:90px"></label></div>
   <p id="msum" class="sub"></p><p id="mmsg" class="sub" style="color:var(--hot)"></p>
   <p><button class="pri" id="mgo">Apply</button></p>
   <div class="sub">You can undo this from Settings. If the Google Sheet still has the old numbers, that's fine — the app remembers this change when you drop the sheet in again.</div>`;
  const drawList=()=>{ const f=$('mfind').value.trim().toLowerCase();
    $('mlist').innerHTML=list.filter(b=>!f||b.id.toLowerCase().includes(f)||sel.has(b.id)).map(b=>`<label style="display:flex;gap:10px;align-items:center;padding:4px 0"><input type="checkbox" data-mb="${esc(b.id)}" ${sel.has(b.id)?'checked':''}> <b>${esc(b.id)}</b> <span class="sub">${b.left} of ${b.cap}${b.loc==='Overflow'?' · Overflow':''}</span></label>`).join('')||'<div class="sub">No boxes match.</div>'; };
  let capTouched=false;
  const calc=()=>{
    const res=normLoc($('mres').value), tgt=res.box, byId=Object.fromEntries(list.map(b=>[b.id,b]));
    const froms=[...sel].filter(b=>b!==tgt);
    const involved=[...new Set([...sel,...(tgt&&byId[tgt]?[tgt]:[])])];
    const total=involved.reduce((a,b)=>a+(byId[b]?byId[b].left:0),0);
    const caps=involved.map(b=>byId[b]?byId[b].cap:0);
    if(!capTouched) $('mcap').value=caps.length?Math.max(...caps):state.cap;
    const cap=parseInt($('mcap').value,10)||0;
    let msg='',sum='';
    if(!sel.size) msg='Tick at least one box.';
    else if(!tgt) msg=$('mres').value.trim()?'The number must look like “Box 12” or “Calchef 2”.':'';
    else if(!froms.length) msg='Pick a number different from the box you ticked, or tick another box to merge.';
    if(tgt&&froms.length){
      const isMerge=involved.length>1;
      sum=isMerge?`${froms.join(', ')} → <b>${esc(tgt)}</b>: ${total} samples together, capacity ${cap}${total>cap?' <b style="color:var(--hot)">(over capacity)</b>':''}.`
                 :`<b>${esc(froms[0])}</b> will be renamed <b>${esc(tgt)}</b> (${total} samples).`;
    }
    $('msum').innerHTML=sum; $('mmsg').textContent=msg; $('mgo').disabled=!!msg||!tgt||!froms.length;
    return {tgt,froms,cap};
  };
  drawList(); calc();
  $('mfind').oninput=drawList;
  $('mlist').onchange=e=>{ const b=e.target.dataset.mb; if(b==null) return; e.target.checked?sel.add(b):sel.delete(b); if(!$('mres').value.trim()&&sel.size===1) {} capTouched=false; calc(); };
  $('mres').oninput=()=>{ capTouched=false; calc(); };
  $('mcap').oninput=()=>{ capTouched=true; calc(); };
  $('mgo').onclick=()=>{
    const {tgt,froms,cap}=calc(); if(!tgt||!froms.length) return;
    const g=applyMerge(froms,tgt,cap);
    $('dt').textContent='Done';
    $('dbody').innerHTML=`<p><b>${esc(froms.join(', '))}</b> ${froms.length>1?'are':'is'} now <b>${esc(tgt)}</b>.</p><p><button id="mundo">Undo</button> <button id="mopen" class="pri">Open ${esc(tgt)}</button></p>`;
    $('mundo').onclick=()=>{ undoMerge(g); $('dlg').close(); };
    $('mopen').onclick=()=>openBox(tgt);
  };
  if(!$('dlg').open) $('dlg').showModal();
  if(focusResult) { $('mres').focus(); $('mres').select(); }
}

 es:{title:'Ayuda / Preguntas',items:[
  ['¿Para qué sirve esta app?','Muestra en qué caja está cada muestra de referencia (color / CAD), qué tan llena está cada caja y qué cajas se pueden juntar. Todos ven los mismos datos.'],
  ['¿Cómo leo la tarjeta de una caja?','El número es la caja. “74 / 100” = hay 74 muestras y caben 100. Verde = se está llenando, naranja = casi vacía, rojo / FULL = llena. “Overflow” = la caja está en el segundo lugar. Toca la tarjeta para ver lo que tiene.'],
  ['¿Cómo encuentro una muestra?','Escribe el número de artículo o de trabajo en la barra de búsqueda. Te dice en qué caja(s) está. Toca Open para verla.'],
  ['Sacan una muestra de una caja','Abre la caja, marca <b>Pulled</b> en esa muestra y en “Now at” elige la caja a donde fue, o escribe dónde está (por ejemplo “Box 12”). Si ya no existe, déjalo vacío. Los conteos se actualizan para todos.'],
  ['Marqué Pulled por error','Quita la marca. La muestra vuelve a la caja.'],
  ['¿Cómo marco una caja como llena?','Abre la caja y toca <b>Mark as full</b>. La app recuerda que esa caja está llena con el número de hoy (las cajas con muestras grandes se llenan con menos). Toca <b>Unmark full</b> para deshacer.'],
  ['¿Cómo agrego una muestra a mano?','Toca <b>+ Add sample</b>. Elige o escribe la caja, el número de artículo (y de trabajo si lo tienes) y toca Add to box. Para borrar una que agregaste por error, abre la caja y toca la ✕.'],
  ['¿Cómo junto (combino) cajas?','Toca <b>Merge / renumber boxes</b> (o <b>Merge…</b> en una sugerencia). Marca las cajas, escribe el número que tendrá la caja final (uno de ellos o uno nuevo), revisa la capacidad y toca Apply. Mueve también las muestras físicamente. ¿Error? Settings → Recent box changes → Undo.'],
  ['¿Cómo cambio el número de una caja?','Abre la caja y toca <b>Change number</b>, escribe el número nuevo y Apply. Todas sus muestras se van con ella. Si escribes el número de otra caja, se juntan. Se puede deshacer en Settings.'],
  ['¿Cómo actualizo los datos?','Copia las 4 columnas (Timestamp, Job_Number, Inventory_Item, Sample Location) a un archivo de Excel y arrástralo al cuadro punteado de arriba. La app solo lee esas columnas. Te pide confirmar porque <b>cambia los datos para todos</b>. Los Pulled y las muestras manuales se conservan.'],
  ['Faltan algunas entradas','Solo se cuentan ubicaciones que parecen una caja (Box 12, Bx12, Calchef 2…). “Given to Johana” o “1st pass” se ignoran (ver abajo “Location entries ignored”). Escribe “Box 12” siempre igual.'],
  ['¿Qué significa “Offline – changes waiting”?','Se perdió la conexión. Tus cambios están guardados y se envían solos cuando regrese. Deja la página abierta hasta que diga “synced”.'],
  ['¿Qué son Main y Overflow?','Dónde está guardada la caja. Se cambia dentro de la ventana de la caja. Usa el filtro de arriba para ver un solo lugar.']
 ]}
};
let helpLang=(()=>{ try{ return localStorage.getItem('sampleBoxTracker.lang')||'en'; }catch(e){ return 'en'; } })();
function openHelp(){
  curBox=null; $('dbody').onchange=null; $('dbody').onclick=null;
  const h=HELP[helpLang];
  $('dt').textContent=h.title;
  $('dctl').innerHTML=`<button id="hlang">${helpLang==='en'?'Español':'English'}</button>`;
  $('hlang').onclick=()=>{ helpLang=helpLang==='en'?'es':'en'; try{localStorage.setItem('sampleBoxTracker.lang',helpLang);}catch(e){} openHelp(); };
  $('dbody').innerHTML=h.items.map((q,i)=>`<details ${i===0?'open':''}><summary><b>${q[0]}</b></summary><p style="margin:6px 0 10px">${q[1]}</p></details>`).join('');
  if(!$('dlg').open) $('dlg').showModal();
}

/* ---------- light / dark ---------- */
function setTheme(th){ document.documentElement.dataset.theme=th; try{localStorage.setItem('sampleBoxTracker.theme',th);}catch(e){} $('themeBtn').textContent=th==='dark'?'Light':'Dark'; }
$('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'Light':'Dark';
$('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
/* ---------- wiring ---------- */
$('helpBtn').onclick=openHelp;
const drop=$('drop'), fi=$('file');
drop.onclick=()=>fi.click();
fi.onchange=()=>fi.files[0]&&readFile(fi.files[0]);
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0]; if(f) readFile(f);});
window.addEventListener('dragover',e=>e.preventDefault()); window.addEventListener('drop',e=>{e.preventDefault(); if(e.target!==drop&&!drop.contains(e.target)){const f=e.dataTransfer.files[0]; if(f) readFile(f);}});
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]'); if(o) openBox(o.dataset.open); const m=e.target.closest('[data-merge]'); if(m){ const [a,b]=m.dataset.merge.split('|'); openMerge([a,b],b); }});
$('dclose').onclick=()=>{curBox=null;$('dlg').close();};
['q','filter','sort'].forEach(i=>$(i).addEventListener(i==='q'?'input':'change',render));
$('settings').onclick=openSettings;
$('addBtn').onclick=()=>openAdd('');
$('mergeBtn').onclick=()=>openMerge([],'');
render();
showSync();
poll();
setInterval(()=>{ if(!document.hidden) poll(); }, 120000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });
window.addEventListener('online',()=>{ flush(); poll(); });
</script>
</body>
</html>
