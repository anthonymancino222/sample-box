/* ---------- write box changes back to the Google Sheet (Sample Location column ONLY) ----------
   Your box changes (renumber, merge, delete, pull) are a draft inside the app. "Sheet changes" shows exactly which
   Sample Location cells would change, writes them after you confirm (passphrase), logs the old + new value of every
   cell, and can revert a whole batch. Notes, edited dates and hand-added products never go to the sheet. */
const sbNorm=s=>String(s==null?'':s).trim();
function sheetChanges(){
  const changes=[]; let noId=0, complex=0;
  complex=Object.keys(state.pulled).filter(k=>k.includes('>')).length;
  for(const r of state.rows){
    if(!r.id||!r.row){ noId++; continue; }
    const raw=sbNorm(r.raw!=null?r.raw:''); let desired;
    const p=state.pulled[r.k], b=resolveBox(r.box,r.ts);
    if(p && (!p.from || resolveBox(p.from,null,p.at)===b)){
      const to=sbNorm(p.to);
      if(to===''||to===DELD||to===COMMIT) desired='';
      else { const n=normLoc(to); desired=n.box?resolveBox(n.box,null,p.at):to; }
    } else desired=(b!==r.box)?b:raw;
    if(desired===DEL) desired='';
    if(sbNorm(desired)!==raw) changes.push({row:r.row,id:r.id,expect:raw,set:sbNorm(desired),item:r.item,k:r.k});
  }
  return {changes,noId,complex,appOnly:state.manual.length};
}
function sheetPending(){ if(!WRITER_URL) return 0; try{ return sheetChanges().changes.length; }catch(e){ return 0; } }
function sheetBadge(){ const b=document.getElementById('sheetBtn'); if(!b) return; const n=sheetPending(); b.querySelector('.lbl').textContent=n?('Sheet changes ('+n+')'):'Sheet changes'; }
const sbPass=()=>{ try{ return sessionStorage.getItem('sampleBoxTracker.writePass')||''; }catch(e){ return ''; } };
async function sbPost(changes,batch,pass){
  const out=[];
  for(let i=0;i<changes.length;i+=400){
    const part=changes.slice(i,i+400);
    const r=await fetch(WRITER_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({pass,batch,changes:part.map(c=>({row:c.row,id:c.id,expect:c.expect,set:c.set}))})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'the sheet writer refused');
    j.results.forEach((st,n)=>out.push({c:part[n],st}));
  }
  return out;
}
async function writeToSheet(){
  const msg=$('swmsg'), btn=$('swgo'); const pass=$('swpass').value.trim();
  const cs=sheetChanges();
  if(!cs.changes.length){ msg.textContent='Nothing to write.'; return; }
  if(!pass){ msg.textContent='Enter the write passphrase first.'; return; }
  if(!confirm('Update '+cs.changes.length+' cell'+(cs.changes.length===1?'':'s')+' in the Sample Location column of the Google Sheet?\n\nOnly that column changes. Every old value is saved, and you can revert this batch afterwards.')) return;
  try{ sessionStorage.setItem('sampleBoxTracker.writePass',pass); }catch(e){}
  btn.disabled=true; msg.textContent='Writing to the Google Sheet…';
  const batch='b'+Date.now().toString(36), at=Date.now();
  try{
    const res=await sbPost(cs.changes,batch,pass);
    const okSet=new Set(), fails=[];
    res.forEach(x=>{ if(x.st==='ok'||x.st==='already') okSet.add(x.c.k); else fails.push(x); });
    op({op:'logWrites',entries:res.map(x=>({batch,at,id:x.c.id,row:x.c.row,item:x.c.item,old:x.c.expect,new:x.c.set,status:x.st}))});
    // the written rows are no longer a draft: drop their pulls
    for(const k of Object.keys(state.pulled)){ if(okSet.has(k.split('>')[0])){ delete state.pulled[k]; op({op:'clearPull',k}); } }
    if(!fails.length){
      // every box change is now real in the sheet -> retire the renumber/merge/delete drafts (keep hand-added products consistent)
      state.manual.forEach(m=>{ const nb=resolveBox(m.box,m.ts); if(nb===DEL){ state.pulled[m.k]={from:m.box,to:COMMIT,at}; opPull(m.k); } else if(nb!==m.box){ m.box=nb; m.series=seriesOf(nb); op({op:'addManual',entry:m}); } });
      [...new Set(state.moves.map(m=>m.g))].forEach(g=>op({op:'delMoves',g})); state.moves=[];
    }
    save(); undoReset(); render();
    msg.textContent=(res.length-fails.length)+' written'+(fails.length?(', '+fails.length+' skipped because the sheet changed meanwhile: '+fails.slice(0,3).map(f=>'row '+f.c.row+' ('+f.st+')').join(', ')):'')+'. Refreshing from the sheet…';
    state.srcHash=''; await syncFromSheet(true);
    openSheetChanges(msg.textContent.replace(/ Refreshing from the sheet…$/,'')+' Batch '+batch+' saved in the log.');
  }catch(e){ msg.textContent='Could not write: '+(e.message||e); btn.disabled=false; }
}
async function revertBatch(batch){
  const pass=sbPass()||(($('swpass')||{}).value||'').trim(); if(!pass){ alert('Enter the write passphrase first (in the box above).'); return; }
  if(!confirm('Revert batch '+batch+'? The cells it changed go back to their old values in the Google Sheet.')) return;
  try{
    const j=await (await fetch(BACKEND_URL+'?action=sheetlog&cb='+Date.now())).json();
    const ents=(j.rows||[]).filter(r=>r[0]===batch&&r[7]==='ok');
    if(!ents.length){ alert('Nothing to revert for that batch.'); return; }
    const inv=ents.map(r=>({row:Number(r[3]),id:r[2],expect:r[6],set:r[5],item:r[4]}));
    const rb='r'+Date.now().toString(36), at=Date.now();
    const res=await sbPost(inv,rb,pass);
    op({op:'logWrites',entries:res.map(x=>({batch:rb,at,id:x.c.id,row:x.c.row,item:x.c.item,old:x.c.expect,new:x.c.set,status:x.st}))});
    op({op:'markBatch',batch,status:'reverted'});
    state.srcHash=''; await syncFromSheet(true);
    openSheetChanges('Reverted '+res.filter(x=>x.st==='ok').length+' cell(s) from batch '+batch+'.');
  }catch(e){ alert('Could not revert: '+(e.message||e)); }
}
async function openSheetChanges(note){
  curBox=null; $('dbody').onchange=null; $('dbody').onclick=null; $('dctl').innerHTML='';
  $('dt').textContent='Sheet changes';
  const cs=sheetChanges(), groups={};
  cs.changes.forEach(c=>{ const key=(c.expect||'(blank)')+'  →  '+(c.set||'(cleared)'); groups[key]=(groups[key]||0)+1; });
  const glist=Object.entries(groups).sort((a,b)=>b[1]-a[1]);
  $('dbody').innerHTML=`${note?`<div class="flash">${esc(note)}</div>`:''}
    <p class="sub">Only the <b>Sample Location</b> column of the Google Sheet is ever changed. Notes, edited dates and hand-added products stay in the app.</p>
    <h4 style="font:600 20px var(--serif);margin:10px 0 6px">Waiting to be written <span class="sub">(${cs.changes.length})</span></h4>
    ${glist.length?glist.slice(0,60).map(([k,n])=>`<div class="sug"><span style="font-family:var(--mono)">${esc(k)}</span><span class="sub">${n} product${n>1?'s':''}</span></div>`).join('')+(glist.length>60?`<div class="sub">…and ${glist.length-60} more kinds of change</div>`:''):'<div class="sub">Nothing is waiting. Renumber, merge, delete or pull products first, then come back here.</div>'}
    ${cs.noId?`<p class="sub">${cs.noId} product${cs.noId>1?'s':''} have no sheet row yet: tap <b>Sync sheet</b> once so every product knows its row.</p>`:''}
    ${cs.complex?`<p class="sub">${cs.complex} chained move${cs.complex>1?'s':''} (a product pulled twice) will be written after the first move is done.</p>`:''}
    ${cs.appOnly?`<p class="sub">${cs.appOnly} hand-added product${cs.appOnly>1?'s':''} live only in the app (they have no row in the sheet).</p>`:''}
    <p><label>Write passphrase<br><input id="swpass" type="password" autocomplete="off" value="${esc(sbPass())}" style="width:240px"></label></p>
    <p id="swmsg" class="sub" style="color:var(--danger)"></p>
    <p><button class="pri" id="swgo" ${cs.changes.length?'':'disabled'}>Write ${cs.changes.length} change${cs.changes.length===1?'':'s'} to the Google Sheet</button></p>
    <h4 style="font:600 20px var(--serif);margin:18px 0 6px">Recent writes</h4><div id="swlog" class="sub">Loading…</div>`;
  if(!$('dlg').open) $('dlg').showModal();
  $('swgo').onclick=writeToSheet;
  $('dbody').onclick=e=>{ const b=e.target.closest&&e.target.closest('[data-revert]'); if(b) revertBatch(b.dataset.revert); };
  try{
    const j=await (await fetch(BACKEND_URL+'?action=sheetlog&cb='+Date.now())).json(); const by={};
    (j.rows||[]).forEach(r=>{ const b=by[r[0]]||(by[r[0]]={batch:r[0],at:Number(r[1]),n:0,st:r[7],items:[]}); if(r[7]==='ok'||r[7]==='reverted') b.n++; if(r[7]==='reverted') b.st='reverted'; if(b.items.length<3) b.items.push(r[4]); });
    const bl=Object.values(by).sort((a,b)=>b.at-a.at).slice(0,8);
    $('swlog').innerHTML=bl.length?bl.map(b=>`<div class="sug"><span>${new Date(b.at).toLocaleString()} · ${b.n} cell${b.n===1?'':'s'}${b.batch[0]==='r'?' · a revert':''}</span><span class="sub" style="font-family:var(--mono)">${esc(b.items.join(', '))}</span>${b.st==='reverted'?'<span class="pill">reverted</span>':(b.batch[0]==='r'?'':`<button class="sm" data-revert="${esc(b.batch)}">Revert</button>`)}</div>`).join(''):'No writes yet.';
  }catch(e){ $('swlog').textContent='Could not load the log.'; }
}
if(WRITER_URL){ const sbtn=document.getElementById('sheetBtn'); if(sbtn){ sbtn.hidden=false; sbtn.onclick=()=>openSheetChanges(); } setInterval(sheetBadge,1500); }

/* ---------- sync from the Google Sheet (read-only reader) ---------- */
let sheetSyncing=false;
function sheetStatus(msg){ const el=document.getElementById('sheetStat'); if(el) el.textContent=msg||''; }
async function syncFromSheet(auto){
  if(!SOURCE_URL||sheetSyncing) return; sheetSyncing=true;
  const btn=document.getElementById('syncBtn'); if(btn) btn.disabled=true; sheetStatus('Reading the Google Sheet…');
  try{
    const r=await fetch(SOURCE_URL+'?action=rows&cb='+Date.now()); const j=await r.json();
    if(!j.ok) throw new Error(j.error||'The sheet reader returned an error');
    if(!j.rows.length) throw new Error('The sheet returned no rows, so nothing was changed.');
    try{ localStorage.setItem('sampleBoxTracker.srcCheck',String(Date.now())); }catch(e){}
    if(j.hash===state.srcHash && state.rows.length){ sheetStatus('Sheet checked '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' · already up to date'); if(!auto) toast('Already up to date with the Google Sheet'); return; }
    // keep existing row keys stable (older imports were off by a millisecond on some rows)
    const alias=new Map(); state.rows.forEach(x=>{ if(x.ts!=null) alias.set(x.job+'|'+x.item+'|'+Math.round(x.ts/1000),x.ts); });
    const aoa=[['Timestamp','Job_Number','Inventory_Item','Sample Location','Sheet ID','Sheet Row']].concat(j.rows.map(x=>{
      const ms=x[1]; const ts=ms==null?null:(alias.get(x[2]+'|'+x[3]+'|'+Math.round(ms/1000))??ms);
      return [ts==null?'':new Date(ts),x[2],x[3],x[4],x[0],x[5]]; }));
    ingest(aoa,{noConfirm:true,srcHash:j.hash});
    sheetStatus('Synced from the Google Sheet '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}));
    toast('Synced '+state.rows.length+' products from the Google Sheet');
  }catch(e){ sheetStatus('Could not read the Google Sheet'); if(!auto) toast('Sheet sync failed: '+(e.message||e)); }
  finally{ sheetSyncing=false; if(btn) btn.disabled=false; }
}
if(SOURCE_URL){
  const sb=document.getElementById('syncBtn'); if(sb){ sb.hidden=false; sb.onclick=()=>syncFromSheet(false); }
}

render();
showSync();
poll().then(()=>{ let last=0; try{ last=+localStorage.getItem('sampleBoxTracker.srcCheck')||0; }catch(e){} if(SOURCE_URL&&Date.now()-last>30*60*1000) syncFromSheet(true); });
setInterval(()=>{ if(!document.hidden) poll(); }, 120000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });
window.addEventListener('online',()=>{ flush(); poll(); });
</script>
