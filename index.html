<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample Box Tracker</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sample Boxes">
<script>try{var th=localStorage.getItem('sampleBoxTracker.theme');if(!th)th=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=th;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Grand library, lit for the future: parchment by day, candlelit reading room by night */
:root{
  color-scheme:light;
  --bg:#f1e9d6;--bg2:#e9dfc6;--card:#fbf6ea;--card2:#f6eedb;
  --ink:#2a2018;--mute:#7b6a55;--line:#d9c9a8;--line2:#c9b68f;
  --accent:#7a5a28;--accent-ink:#fffaf0;--accent2:#2f5b4e;--glow:rgba(122,90,40,.10);
  --ok:#55805f;--warn:#b27a1c;--hot:#a5442e;
  --okbg:#e2ecd9;--warnbg:#f5e5be;--hotbg:#f2d9cf;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 6px 18px rgba(80,55,20,.10);
  --serif:'Cormorant Garamond','EB Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'JetBrains Mono',Consolas,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14110e;--bg2:#1a1510;--card:#1f1913;--card2:#251e16;
  --ink:#eee2c9;--mute:#a69581;--line:#3a2f23;--line2:#52422f;
  --accent:#d9ad5f;--accent-ink:#1c150b;--accent2:#7fb09c;--glow:rgba(217,173,95,.10);
  --ok:#8db798;--warn:#e0b25a;--hot:#dc8570;
  --okbg:#1d2c24;--warnbg:#35290f;--hotbg:#3b1f18;
  --shadow:0 1px 0 rgba(255,235,190,.05) inset,0 8px 22px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){--bg:#14110e;--bg2:#1a1510;--card:#1f1913;--card2:#251e16;--ink:#eee2c9;--mute:#a69581;--line:#3a2f23;--line2:#52422f;--accent:#d9ad5f;--accent-ink:#1c150b;--accent2:#7fb09c;--glow:rgba(217,173,95,.10);--ok:#8db798;--warn:#e0b25a;--hot:#dc8570;--okbg:#1d2c24;--warnbg:#35290f;--hotbg:#3b1f18;color-scheme:dark}
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.55 var(--sans);
  background:
   radial-gradient(1100px 520px at 50% -140px,var(--glow),transparent 70%),
   linear-gradient(var(--bg),var(--bg2)) fixed;
  min-height:100vh;transition:background .5s,color .4s}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

/* ---- hero ---- */
.hero{text-align:center;position:relative;padding:18px 0 8px}
.hero .tools{position:absolute;right:0;top:6px;display:flex;gap:8px}
.hero h1{font:600 clamp(30px,5vw,46px)/1.1 var(--serif);letter-spacing:.02em;margin:6px 0 4px}
.hero .tagline{font:italic 500 18px/1.4 var(--serif);color:var(--mute);margin:0}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--accent);margin:2px auto 0;max-width:340px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.orn svg{width:26px;height:26px}
.status{margin-top:10px;font-size:12px;color:var(--mute);display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.sub{color:var(--mute);font-size:13px}

/* ---- drop zone ---- */
#drop{margin:22px 0;border:1.5px dashed var(--line2);border-radius:14px;padding:20px 18px;text-align:center;
  background:var(--card);cursor:pointer;color:var(--mute);box-shadow:var(--shadow);transition:all .35s ease;font-size:14px}
#drop:hover{border-color:var(--accent)}
#drop.over{border-color:var(--accent);background:var(--card2);box-shadow:0 0 0 4px var(--glow)}
#drop b{color:var(--accent);font:600 19px var(--serif)}
#drop.slim{margin:12px 0 16px;padding:8px 14px;font-size:12px;box-shadow:none}
#drop.slim b{font-size:15px}

/* ---- tiles & panels ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:center;box-shadow:var(--shadow)}
.tile .n{font:600 40px/1 var(--serif);color:var(--accent)}
.tile .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow);position:relative}
.panel::before{content:"";position:absolute;inset:4px;border:1px solid var(--line);border-radius:10px;pointer-events:none;opacity:.55}
.panel h2{font:600 24px var(--serif);margin:0 0 8px;letter-spacing:.01em}
.sug{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.sug:first-of-type{border-top:0}

/* ---- controls ---- */
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;transition:border-color .25s,background .25s,box-shadow .25s}
input:focus,select:focus,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
button{cursor:pointer}
button:hover{border-color:var(--accent);background:var(--card2)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;letter-spacing:.02em}
button.pri:hover{filter:brightness(1.07);background:var(--accent)}
button.icon,.hero .tools button{border-radius:99px;padding:6px 14px;font-size:13px;background:transparent}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
#q{flex:1;min-width:220px;background:var(--card);font-family:var(--serif);font-size:18px;padding:9px 16px}
#q::placeholder{font-style:italic;color:var(--mute)}

/* ---- box cards: little catalogue drawers ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.box{background:linear-gradient(var(--card),var(--card2));border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;cursor:pointer;
  box-shadow:var(--shadow);position:relative;transition:transform .35s ease,border-color .3s,box-shadow .35s}
.box::after{content:"";position:absolute;inset:3px;border:1px solid var(--line);border-radius:9px;opacity:.45;pointer-events:none}
.box:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 26px var(--glow),var(--shadow)}
.box .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box .t b{font:600 23px/1 var(--serif);letter-spacing:.02em;padding:4px 12px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink)}
.pill{font-size:11px;letter-spacing:.06em;padding:2px 10px;border-radius:99px;background:transparent;color:var(--mute);border:1px solid var(--line2)}
.pill.off{background:var(--warnbg);color:var(--warn);border-color:transparent}
.meter{height:7px;border-radius:99px;background:var(--bg);margin:14px 0 8px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:99px;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.f-ok{background:var(--ok)}.f-low{background:var(--warn)}.f-hot{background:var(--hot)}
.meta{font:13px var(--mono);color:var(--mute);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.tag.merge{background:var(--warnbg);color:var(--warn)}.tag.full{background:var(--hotbg);color:var(--hot)}

/* ---- dialog ---- */
dialog{border:1px solid var(--line2);border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(780px,96vw);max-height:90vh;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,14,8,.55)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card2);border-radius:16px 16px 0 0}
.dh h3{margin:0;flex:1;font:600 26px var(--serif);letter-spacing:.01em}
.db{padding:8px 20px 20px;overflow-y:auto;overflow-x:hidden;max-height:68vh}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
td{font-family:var(--mono);font-size:13px}
tr.pulled td{opacity:.45;text-decoration:line-through}
td.np{font-family:var(--sans)}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
details{margin-top:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
summary{cursor:pointer;color:var(--ink);font-size:15px;padding:6px 0}
summary b{font:600 19px var(--serif)}
summary::marker{color:var(--accent)}
.msg{padding:12px 14px;border-radius:10px;background:var(--hotbg);color:var(--hot);margin-bottom:14px;display:none}
.empty{text-align:center;color:var(--mute);padding:36px;font:italic 20px var(--serif)}
@media(max-width:560px){.wrap{padding:14px 12px 40px}.hero .tools{position:static;justify-content:center;margin-bottom:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* =====================================================================
   THE ARCHIVE VAULT - Olympian serenity layer
   Parian marble / olive / roman bronze / oracle-ether glow
   ===================================================================== */
:root{
  --bg:#f5f2eb;--bg2:#ece7da;--card:#fbf9f4;--card2:#f3efe4;
  --ink:#2a2c20;--mute:#6c7052;--line:#ddd6c3;--line2:#c8bd9c;
  --accent:#b58a43;--accent-ink:#2a2110;--accent-txt:#8a6420;--accent2:#606c38;
  --ether:#e0f2fe;--etherglow:rgba(96,176,228,.38);--glow:rgba(224,242,254,.9);
  --ok:#606c38;--warn:#c08a22;--hot:#8a5a1e;
  --okbg:#e5e9d3;--warnbg:#f3e6c6;--hotbg:#ecdcc1;
  --data:#2d6a92;--dataglow:rgba(96,176,228,.45);
  --shadow:0 1px 0 rgba(255,255,255,.85) inset,0 3px 10px rgba(96,108,56,.10);
  --serif:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif;
  --serif2:'Cormorant Garamond',Georgia,serif;
  --mono:'JetBrains Mono','Roboto Mono',ui-monospace,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0f130e;--bg2:#151a12;--card:#191e15;--card2:#1f2519;
  --ink:#ece8da;--mute:#a2a68a;--line:#2c3321;--line2:#454c33;
  --accent:#d3a65c;--accent-ink:#1a1408;--accent-txt:#dcb36c;--accent2:#9db070;
  --etherglow:rgba(110,190,240,.30);--glow:rgba(110,190,240,.10);
  --ok:#9db070;--warn:#e2b45e;--hot:#d3a65c;
  --okbg:#212a18;--warnbg:#33290f;--hotbg:#3a2e14;
  --data:#8fd0f5;--dataglow:rgba(120,200,250,.55);
  --shadow:0 1px 0 rgba(224,242,254,.05) inset,0 4px 12px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){--bg:#0f130e;--bg2:#151a12;--card:#191e15;--card2:#1f2519;--ink:#ece8da;--mute:#a2a68a;--line:#2c3321;--line2:#454c33;--accent:#d3a65c;--accent-ink:#1a1408;--accent-txt:#dcb36c;--accent2:#9db070;--etherglow:rgba(110,190,240,.30);--glow:rgba(110,190,240,.10);--ok:#9db070;--warn:#e2b45e;--hot:#d3a65c;--okbg:#212a18;--warnbg:#33290f;--hotbg:#3a2e14;--data:#8fd0f5;--dataglow:rgba(120,200,250,.55)}
}

/* ---- marble ground: ether glow above, soft veining beneath ---- */
html{background:var(--bg)}
body{background:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;transform:translateZ(0);
  background:radial-gradient(900px 480px at 50% -120px,var(--glow),transparent 72%),url(icons/marble.png) center top/520px 520px repeat,linear-gradient(var(--bg),var(--bg2))}
:root[data-theme="dark"] body::before{background:radial-gradient(900px 480px at 50% -120px,var(--glow),transparent 72%),url(icons/marble.png) center top/520px 520px repeat,linear-gradient(var(--bg),var(--bg2));background-blend-mode:normal,soft-light,normal}

/* ---- hero: temple, eyebrow, inscription ---- */
.hero{padding-top:6px}
.eyebrow{font:500 11px var(--serif);letter-spacing:.5em;text-transform:uppercase;color:var(--accent-txt);margin-top:4px;padding-left:.5em}
.hero h1{font:600 clamp(26px,4.6vw,42px)/1.15 var(--serif);letter-spacing:.12em;text-transform:uppercase;margin:8px 0 6px}
.hero .tagline{font:italic 500 19px/1.4 var(--serif2);color:var(--mute)}
.orn{max-width:420px;color:var(--accent)}
.orn svg{width:46px;height:34px}
.orn i{background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.55}
.hero .tools{gap:6px}
html{overflow-x:hidden}
button{white-space:nowrap}
@media(max-width:560px){.hero .tools{flex-wrap:wrap;justify-content:center}}
.status{font-family:var(--mono);font-size:11px}

/* ---- buttons with bronze line-icons ---- */
button{display:inline-flex;align-items:center;gap:8px;position:relative}
.ic{width:17px;height:17px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

button.pri .ic{stroke:var(--accent-ink)}
.hero .tools button,button.icon{font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px}
button{transition:border-color .25s,background .25s,box-shadow .3s,color .25s}
button:hover{box-shadow:0 0 0 1px var(--accent) inset}
button.pri{background:linear-gradient(180deg,#c79a52,#a37832);border-color:#a37832;color:#fff9ea}
:root[data-theme="dark"] button.pri{background:linear-gradient(180deg,#e0b86e,#b88a3e);border-color:#b88a3e;color:#1a1408}
button.pri .ic{stroke:currentColor}
.bar button{font-size:13px}

/* ---- Temple Offering: glass slot, laser-etched meander ---- */
#drop{position:relative;overflow:hidden;padding:28px 22px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.25));
  
  box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 0 22px var(--etherglow),var(--shadow);
  border-radius:16px;color:var(--mute);transition:box-shadow .4s ease,border-color .3s}
:root[data-theme="dark"] #drop{background:linear-gradient(180deg,rgba(224,242,254,.07),rgba(224,242,254,.02));box-shadow:0 0 0 1px rgba(224,242,254,.06) inset,0 0 38px var(--etherglow),var(--shadow)}
#drop::before,#drop::after{content:"";position:absolute;left:14px;right:14px;height:12px;opacity:.7;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='12' viewBox='0 0 24 12'><path d='M0 11.5H2V.5H11V8H5V4H8' fill='none' stroke='%23b58a43' stroke-width='1.1' stroke-linejoin='miter'/><path d='M11 .5H13V11.5H22V4H16V8H19' fill='none' stroke='%23b58a43' stroke-width='1.1' stroke-linejoin='miter' transform='translate(0 0)'/></svg>") repeat-x 0 0/24px 12px}
#drop::before{top:9px}#drop::after{bottom:9px;transform:scaleY(-1)}
#drop:hover,#drop.over{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 0 30px var(--etherglow),var(--shadow)}
#drop .offer{display:flex;flex-direction:column;align-items:center;gap:8px}
#drop .offer svg{width:34px;height:34px;fill:none;stroke:var(--accent);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;}
#drop b{font:600 17px var(--serif);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-txt)}
#drop.slim{padding:10px 14px;margin:12px 0 18px}
#drop.slim::before,#drop.slim::after{height:6px;background-size:12px 6px;left:10px;right:10px}
#drop.slim::before{top:4px}#drop.slim::after{bottom:4px}
#drop.slim .offer{flex-direction:row;justify-content:center;gap:10px}
#drop.slim .offer svg{width:20px;height:20px}
#drop.slim b{font-size:12px}

/* ---- tiles / panels: bronze hairlines, ether numerals ---- */
.tile{border-color:var(--line2);background:linear-gradient(180deg,var(--card),var(--card2))}
.tile .n{font:500 38px/1 var(--mono);color:var(--data);letter-spacing:-.02em}
.tile .l{font:500 10px var(--serif);letter-spacing:.22em;color:var(--mute)}
.panel{border-color:var(--line2)}
.panel h2{font:600 17px var(--serif);letter-spacing:.2em;text-transform:uppercase;color:var(--accent-txt);text-align:center;margin:2px 0 12px}
.panel h2::after{content:"";display:block;width:60px;height:1px;margin:8px auto 0;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
#mergePanel h2::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:10px;vertical-align:1px;background:var(--data);box-shadow:0 0 8px var(--dataglow)}

/* ---- search ---- */
#q{font:italic 500 19px var(--serif2);border-color:var(--line2)}
#q:focus{box-shadow:0 0 0 3px var(--etherglow)}

/* ---- the Great Halls ---- */
.halls{display:block}
.hall{margin-bottom:34px}
.hall-h{display:flex;align-items:center;gap:16px;margin:6px 0 18px;text-align:center}
.hall-h::before,.hall-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
.hall-h::after{transform:scaleX(-1)}
.hall-t{font:600 17px var(--serif);letter-spacing:.24em;text-transform:uppercase;color:var(--accent-txt);white-space:nowrap}
.hall-s{display:block;font:italic 500 15px var(--serif2);letter-spacing:.02em;color:var(--mute);text-transform:none;margin-top:2px}
.hall .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}

/* ---- box cards: scrolls (open), sealed crests (full), holographic pulse (merge) ---- */
.box{--mx:50%;--my:0%;overflow:hidden;border-color:var(--line2);transition:transform .35s ease,border-color .3s,box-shadow .35s}
.box::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s ease;
  background:radial-gradient(260px circle at var(--mx) var(--my),var(--etherglow),transparent 65%)}
.box:hover::before{opacity:1}
.box:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 20px var(--etherglow),var(--shadow)}
.box .t b{font:600 15px/1 var(--serif);letter-spacing:.14em;text-transform:uppercase;border-color:var(--line2)}
.box .meta{font-family:var(--mono);font-size:12px}
.box .cnt{color:var(--data)}
.box .state{display:inline-flex;align-items:center;gap:6px;font:500 10px var(--serif);letter-spacing:.16em;text-transform:uppercase}
.glyph{width:16px;height:16px;flex:none}
.glyph.flame{fill:#e9a51f}
.glyph.crest{fill:var(--accent);stroke:#fff6dc;stroke-width:.6;stroke-opacity:.5}
.glyph.holo{fill:none;stroke:var(--data);stroke-width:1.5}
.glyph.holo .r2{opacity:.55}
.state.open{color:var(--warn)}.state.sealed{color:var(--accent-txt)}.state.merge{color:var(--data)}
.meter{height:6px;border-color:var(--line2)}
.f-ok{background:linear-gradient(90deg,#6f7d42,var(--ok))}
.f-low{background:linear-gradient(90deg,#d9a53a,var(--warn))}
.f-hot{background:linear-gradient(90deg,#c79a52,var(--accent))}
.box.sealed{background:linear-gradient(160deg,var(--card),var(--card2));border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent) inset,var(--shadow)}
.box.sealed .t b{background:linear-gradient(180deg,var(--accent),#8d6628);color:#fff7e0;border-color:#8d6628}
.box.mergeable{border-color:color-mix(in srgb,var(--data) 55%,var(--line2));box-shadow:0 0 12px var(--etherglow),var(--shadow)}
.pill{font-family:var(--mono);font-size:10px}

/* ---- dialogs open like a temple gate ---- */
dialog[open]{animation:gate .35s ease-out both}
dialog[open]::backdrop{animation:fade .35s ease both}

<script>
"use strict";
const LS = 'sampleBoxTracker.v1';
let state = load();           // {cap:100, boxMeta:{id:{loc,cap}}, pulled:{rowKey:1}, rows:[...], stamp}
function load(){ try{ const s=JSON.parse(localStorage.getItem(LS)); if(s&&s.rows){ s.manual=s.manual||[]; s.moves=s.moves||[]; s.dismissed=s.dismissed||{}; s.notes=s.notes||{}; s.dates=s.dates||{}; return s; } }catch(e){} return {cap:100,boxMeta:{},pulled:{},manual:[],moves:[],dismissed:{},notes:{},dates:{},rows:[],stamp:null}; }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  if(typeof undoReady!=='undefined'&&undoReady&&!undoing&&!commitT) commitT=setTimeout(undoCommit,0); }

/* ---------- shared backend (Google Apps Script + Google Sheet) ----------
   Leave BACKEND_URL empty to run local-only. Every change is queued in an outbox, sent as one small
   idempotent write, and the page re-reads the shared data only when the server's version number moved.
   Idle polling is a tiny {v} reply (no sheet is opened server-side), at most once every 2 minutes per open tab. */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwHG1fcnBDV5GWbEc--WLKuvC9GyyIYHSTUvbPWsJDCvUsEeOvd_jeK5KSBGA70OMBE/exec';
// Live feed from the QA checklist Google Sheet (read-only reader). Empty = feature off. The TEST page sets this; the live app leaves it empty until you decide.
const SOURCE_URL = '';
// Writer: the ONLY thing allowed to change the sheet (Sample Location column). Empty = off. The TEST page sets this; the live app leaves it empty.
const WRITER_URL = '';
const OB = 'sampleBoxTracker.outbox';
let outbox = (()=>{ try{ return JSON.parse(localStorage.getItem(OB))||[]; }catch(e){ return []; } })();
let flushing=false, polling=false, lastSync=null, syncErr=null;
const saveOutbox=()=>{ try{ localStorage.setItem(OB, JSON.stringify(outbox)); }catch(e){} };
function op(o){ if(o.op==='import') undoReset(); if(!BACKEND_URL) return; outbox.push(o); saveOutbox(); showSync(); flush(); }
const opMeta=box=>op({op:'setMeta',box,meta:state.boxMeta[box]||null});
const opPull=k=>op({op:'setPull',pull:Object.assign({k},state.pulled[k])});
async function flush(){
  if(!BACKEND_URL||flushing||!outbox.length) return;
  flushing=true;
  const batch=outbox.slice();
  try{
    // text/plain keeps this a "simple" CORS request (no preflight), which Apps Script requires
    const r=await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({ops:batch})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'server error');
    outbox=outbox.slice(batch.length); saveOutbox(); syncErr=null;
    if(state.v!=null && j.v===state.v+1) state.v=j.v;   // nobody else wrote in between: no refetch needed
    lastSync=Date.now(); save();
  }catch(e){ syncErr=String(e.message||e); setTimeout(flush,15000); }
  flushing=false; showSync();
  if(outbox.length&&!syncErr) flush();
}
async function poll(force){
  if(!BACKEND_URL||polling) return;
  if(outbox.length){ await flush(); if(outbox.length) return; }   // never overwrite our own unsent changes
  polling=true;
  try{
    const r=await fetch(BACKEND_URL+'?since='+(force?'':(state.v==null?'':state.v)));
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'server error');
    if(!j.unchanged && j.state){
      const s=j.state;
      state.cap=s.cap; state.stamp=s.stamp; state.ignored=s.ignored; state.boxMeta=s.boxMeta; state.pulled=s.pulled;
      state.rows=s.rows; state.manual=s.manual; state.moves=s.moves||[]; if('srcHash' in s) state.srcHash=s.srcHash;
      if('dismissed' in s){
        const localD=state.dismissed||{}; state.dismissed=Object.assign({},s.dismissed);
        if(!serverDismiss){ serverDismiss=true; for(const k in localD) if(!s.dismissed[k]){ state.dismissed[k]=localD[k]; op({op:'dismissDup',item:k,at:localD[k].at,n:localD[k].n}); } }
      }
      if('dates' in s){ const ld=state.dates||{}; state.dates=Object.assign({},s.dates);
        if(!serverDates){ serverDates=true; for(const k in ld) if(!s.dates[k]){ state.dates[k]=ld[k]; op({op:'setDate',k,ts:ld[k].ts,no:ld[k].no?1:0}); } } }
      if('notes' in s){ const ln=state.notes||{}; state.notes=Object.assign({},s.notes);
        if(!serverNotes){ serverNotes=true; for(const k in ln) if(!s.notes[k]){ state.notes[k]=ln[k]; op({op:'setNote',k,text:ln[k].text,at:ln[k].at}); } } }
      state.v=j.v; save(); undoSync();
      const dlg=$('dlg');
      render();
      if(dlg.open && curBox && !dlg.contains(document.activeElement)) openBox(curBox);
    } else { state.v=j.v; }
    lastSync=Date.now(); syncErr=null;
  }catch(e){ syncErr=String(e.message||e); }
  polling=false; showSync();
}
function showSync(){
  const el=document.getElementById('sync'); if(!el) return;
  if(!BACKEND_URL){ el.textContent='Local only (not shared)'; return; }
  el.textContent = syncErr ? `⚠ Offline – ${outbox.length} change${outbox.length==1?'':'s'} waiting` :
    outbox.length ? 'Saving…' : lastSync ? 'Shared · synced '+new Date(lastSync).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : 'Connecting…';
}
let curBox=null, serverDismiss=false, serverNotes=false, serverDates=false, boxQ='', boxQBox=null;
const boxSel=new Set(); let boxHideDel=false;
let boxSort=(()=>{ try{ return localStorage.getItem('sampleBoxTracker.boxSort')||'date-new'; }catch(e){ return 'date-new'; } })();
function numCmp(x,y,dir){ if(!x&&!y) return 0; if(!x) return 1; if(!y) return -1; const nx=Number(x), ny=Number(y); if(!isNaN(nx)&&!isNaN(ny)) return (nx-ny)*dir; return String(x).localeCompare(String(y),undefined,{numeric:true})*dir; }
function boxCmp(a,b){ let c; if(boxSort==='num-asc') c=numCmp(a.item,b.item,1); else if(boxSort==='num-desc') c=numCmp(a.item,b.item,-1); else if(boxSort==='date-old') c=(a.ts||0)-(b.ts||0); else c=(b.ts||0)-(a.ts||0); return c||((b.ts||0)-(a.ts||0)); }

/* ---------- location normalizer: messy free text -> box id or null ---------- */
function normLoc(raw){
  const t = String(raw==null?'':raw).trim();
  if(!t) return {blank:true};
  let m;
  if(/calchef/i.test(t)){
    const rest = t.replace(/calchef/ig,'').replace(/\bbox\b/ig,' ');
    if(m = rest.match(/\d+/)) return {box:'Calchef '+parseInt(m[0],10), series:'Calchef'};
    if(m = rest.match(/(^|[^a-z])([a-d])([^a-z]|$)/i)) return {box:'Calchef '+m[2].toUpperCase(), series:'Calchef'};
    return {text:t};
  }
  if(m = t.match(/^(?:box|bx|bo|b0x|nx|bxe)\s*#?\s*(\d+)$/i)) return {box:'Box '+parseInt(m[1],10)};
  if(/^boxll$/i.test(t)) return {box:'Box 11'};
  if(m = t.match(/^(?:box|bx)\s*([a-z])$/i)) return {box:'Box '+m[1].toUpperCase()};
  if(/^\d{1,3}$/.test(t)) return {box:'Box '+parseInt(t,10)};
  if(/^b8$/i.test(t)) return {box:'Box 8'};
  return {text:t};
}

/* ---------- import ---------- */
function excelDate(v){
  if(v instanceof Date) return v;
  if(typeof v==='number') return new Date(Math.round((v-25569)*86400000));
  const d=new Date(v); return isNaN(d)?null:d;
}
function findCol(hdr, names){
  const norm = s=>String(s).toLowerCase().replace(/[^a-z]/g,'');
  for(let i=0;i<hdr.length;i++) if(names.includes(norm(hdr[i]))) return i;
  return -1;
}
function ingest(aoa,opts){ opts=opts||{};
  // find header row (within the first 10 rows)
  let hi=-1, c;
  for(let r=0;r<Math.min(10,aoa.length);r++){
    const loc=findCol(aoa[r],['samplelocation','location']);
    if(loc>=0){ hi=r; break; }
  }
  if(hi<0) throw new Error('Could not find a "Sample Location" column. Make sure the file has the same 4 columns as always (including the Sample Location header).');
  const h=aoa[hi];
  c={id:findCol(h,['sheetid']), srow:findCol(h,['sheetrow']), ts:findCol(h,['timestamp','date']), job:findCol(h,['jobnumber','job']), item:findCol(h,['inventoryitem','item','productid']), loc:findCol(h,['samplelocation','location'])};
  const rows=[], seen=new Set(), ignored={};
  for(let r=hi+1;r<aoa.length;r++){
    const a=aoa[r]; if(!a) continue;
    const n=normLoc(a[c.loc]);
    if(n.blank) continue;                       // no sample kept for this job
    if(!n.box){ ignored[n.text]=(ignored[n.text]||0)+1; continue; }   // e.g. "Given to Johana", "1st pass"
    const d=c.ts>=0?excelDate(a[c.ts]):null;
    const job=String(a[c.job]==null?'':a[c.job]).replace(/\.0$/,'').trim();
    let item=String(a[c.item]==null?'':a[c.item]).replace(/\.0$/,'').trim(); if(item==='0') item='';
    const key=(d?d.getTime():'')+'|'+job+'|'+item+'|'+n.box;
    if(seen.has(key)) continue; seen.add(key);
    rows.push({k:(d?d.getTime():'')+'|'+job+'|'+item, box:n.box, series:n.series||'Box', ts:d?d.getTime():null, job, item, id:c.id>=0?String(a[c.id]||''):'', row:c.srow>=0?(Number(a[c.srow])||0):0, raw:c.id>=0?String(a[c.loc]==null?'':a[c.loc]).trim():''});
  }
  if(!rows.length) throw new Error('No sample boxes found in that file, so nothing was changed.');
  if(!opts.noConfirm && BACKEND_URL && state.rows.length && !confirm(`This replaces the shared sample data for everyone with ${rows.length} rows from this file. Continue?`)) return;
  state.rows=rows; state.ignored=ignored; state.stamp=Date.now();
  // The sheet is the source of truth: drop pulls whose row is gone or now sits in a different box
  // (you relabeled it in the sheet), and manual entries the sheet now already contains.
  const live=new Map(rows.map(x=>[x.k,x]));
  for(const k in state.pulled){ if(k.includes('>')) continue; const p=state.pulled[k]; const r=live.get(k)||state.manual.find(x=>x.k===k); if(!r||(p.from&&resolveBox(p.from,null,p.at)!==resolveBox(r.box,r.ts))) delete state.pulled[k]; }
  // pulls on "moved in" copies (key = parentKey>Box) only live as long as their parent pull still points there
  for(const k in state.pulled){ if(!k.includes('>')) continue; const pk=k.slice(0,k.lastIndexOf('>')), par=state.pulled[pk], dest=k.slice(k.lastIndexOf('>')+1);
    if(!par||normLoc(par.to).box!==dest) delete state.pulled[k]; }
  const have=new Set(rows.filter(r=>r.item).map(r=>r.item+'|'+r.job+'|'+resolveBox(r.box,r.ts)));
  state.manual=state.manual.filter(x=>!(x.item&&have.has(x.item+'|'+x.job+'|'+resolveBox(x.box,x.ts))));
  save(); render();
  if(opts.srcHash!==undefined) state.srcHash=opts.srcHash;
  op({op:'import',rows,ignored,stamp:state.stamp, srcHash:state.srcHash||'',
      pulled:Object.keys(state.pulled).map(k=>Object.assign({k},state.pulled[k])), manual:state.manual});
}
async function readFile(f){
  const err=document.getElementById('err'); err.style.display='none';
  try{
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    // use the first sheet that has a Sample Location header
    let aoa=null;
    for(const name of wb.SheetNames){
      const t=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
      if(t.slice(0,10).some(r=>findCol(r,['samplelocation','location'])>=0)){ aoa=t; break; }
    }
    if(!aoa) throw new Error('No sheet with a "Sample Location" column was found in that file.');
    ingest(aoa);
  }catch(e){ err.textContent=e.message; err.style.display='block'; }
}

/* ---------- model ---------- */
const meta=id=>state.boxMeta[id]||(state.boxMeta[id]={});
const capOf=id=>meta(id).cap||state.cap;
const locOf=id=>meta(id).loc||'Main';
const isPulled=r=>!!state.pulled[r.k];
// Every sample row currently known: sheet rows + manual entries, plus a "moved in" copy
// in the destination box for each pulled sample that was given a new box.
// Box renumbers / merges are stored as moves {from,to,at}. A sample recorded as `from` on or before `at`
// now lives in `to`; samples recorded later under the old number are a new physical box and stay put.
const DEL='__deleted__', DELD='__deleted_item__', COMMIT='__removed__';
function resolveBox(box,ts,minAt){
  let b=box;
  for(const m of state.moves){ if(m.from===b && (minAt!=null ? m.at>minAt : (ts==null||ts<=m.at))) b=m.to; }
  return b;
}
const seriesOf=b=>normLoc(b).series||'Box';
function disp(r){
  const b=resolveBox(r.box,r.ts), o=state.dates[r.k];
  if(b===r.box&&!o) return r;
  const x=Object.assign({},r);
  if(b!==r.box){ x.box=b; x.series=seriesOf(b); }
  if(o){ x.ts=o.ts; x.job=o.no?NOORIG:(r.job===NOORIG?'':r.job); }
  return x;
}
function effRows(){
  const out=[];
  const walk=(r,depth)=>{
    out.push(r);
    const p=state.pulled[r.k];
    if(!p||!p.to||depth>5) return;
    if(p.from&&resolveBox(p.from,null,p.at)!==r.box) return;
    const n=normLoc(p.to); if(!n.box) return;              // "Given to Johana" etc: just leaves the boxes
    const db=resolveBox(n.box,null,p.at); if(db===DEL) return;
    walk({k:r.k+'>'+n.box,box:db,series:seriesOf(db),ts:p.at||r.ts,job:r.job,item:r.item,from:r.box},depth+1);
  };
  state.rows.concat(state.manual).forEach(r=>{ const d=disp(r); if(d.box!==DEL) walk(d,0); });
  return out;
}
function boxes(){
  const m={};
  for(const r of effRows()){ const b=m[r.box]||(m[r.box]={id:r.box,series:r.series,rows:[],left:0}); b.rows.push(r); if(!isPulled(r)) b.left++; }
  const list=Object.values(m);
  list.forEach(b=>{ const mt=meta(b.id); b.cap=capOf(b.id); b.loc=locOf(b.id); b.full=b.left>=b.cap; b.pct=b.left/b.cap; b.num=parseInt(b.id.replace(/\D/g,''),10)||999; });
  return list.filter(b=>b.left>0);   // boxes with nothing left are retired
}
function suggestions(list){
  // greedy: smallest box moves into the fullest box that can still hold it (prefer same location)
  const used=new Set(), out=[];
  const asc=[...list].sort((a,b)=>a.left-b.left);
  for(const a of asc){
    if(used.has(a.id)) continue;
    const cands=list.filter(b=>b.id!==a.id && !used.has(b.id) && b.series===a.series && a.left+b.left<=b.cap)
      .sort((x,y)=>(y.loc===a.loc)-(x.loc===a.loc) || y.left-x.left);
    if(!cands.length) continue;
    const t=cands[0]; used.add(a.id); used.add(t.id);
    out.push({from:a,to:t,total:a.left+t.left});
  }
  return out;
}

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=ts=>ts?new Date(ts).toLocaleDateString(undefined,{year:'2-digit',month:'short',day:'numeric'}):'—';
const NOORIG='~not-original';
const ymd=ts=>{ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function setDateOverride(k,o){ if(o){ state.dates[k]=o; if(serverDates) op({op:'setDate',k,ts:o.ts,no:o.no?1:0}); } else { delete state.dates[k]; if(serverDates) op({op:'delDate',k}); } save(); }
const dateCell=r=>r.job===NOORIG?'<span class="pill">Not original date</span>':fdate(r.ts);
function fillClass(p){return p>=0.9?'f-hot':p<=0.5?'f-low':'f-ok';}

  const total=list.reduce((a,b)=>a+b.left,0), over=list.filter(b=>b.loc==='Overflow').length, dupTodo=dupGroups().filter(g=>!g.reviewed).length;

    [list.length,'active boxes'],[total,'samples on hand'],[over,'in overflow location'],[sug.length,'merges possible'],[dupTodo,'duplicate products'],
  ].map(([n,l],i)=>`<div class="tile"${i===4?' data-dupes="1" style="cursor:pointer" title="Review duplicate products"':''}><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  $('mergePanel').innerHTML = `<h2>Consolidation suggestions</h2>` + (sug.length ? sug.map(s=>`
    <div class="sug"><span><b>${esc(s.from.id)}</b> (${s.from.left}${s.from.loc!=='Main'?', '+s.from.loc:''}) &rarr; <b>${esc(s.to.id)}</b> (${s.to.left}${s.to.loc!=='Main'?', '+s.to.loc:''})</span>
    <span class="sub">= ${s.total} of ${s.to.cap} after merge</span>
    <button data-open="${esc(s.from.id)}">See what moves</button> <button data-merge="${esc(s.from.id)}|${esc(s.to.id)}">Merge…</button></div>`).join('')
    : '<div class="sub">No two boxes fit together right now.</div>')
    + `<div class="sub" style="margin-top:6px">After combining, change those rows' Sample Location in the sheet to the surviving box and drop the sheet back in.</div>`;

  let v=list.filter(b=>{
    const f=$('filter').value;
    return f==='all' || (f==='merge'?mergeable.has(b.id):f==='full'?b.full:f==='open'?!b.full:b.loc===f);
  });
  v.sort($('sort').value==='fill'?(a,b)=>a.pct-b.pct:(a,b)=>a.series.localeCompare(b.series)||a.num-b.num);
  const GL={flame:'<svg class="glyph flame" viewBox="0 0 24 24"><path d="M12 2c1.2 3.6 5 5.2 5 10a5 5 0 0 1-10 0c0-2.4 1.1-3.7 2.4-5 .1 1.3.8 2 1.6 2.6C10.6 8.4 11 5 12 2z"/></svg>',
    crest:'<svg class="glyph crest" viewBox="0 0 24 24"><path d="M12 2.5l8 3v6c0 5.2-3.4 8.6-8 10.5-4.6-1.9-8-5.3-8-10.5v-6z"/><path d="M12 7v9M9 9.5h6" stroke="#fff6dc" stroke-width="1.2" fill="none" stroke-opacity=".7"/></svg>',
    holo:'<svg class="glyph holo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle class="r2" cx="12" cy="12" r="8"/></svg>'};
  let ci=0;
  const card=b=>{
    const st=b.full?'sealed':mergeable.has(b.id)?'merge':'open';
    const lab=st==='sealed'?'Full':st==='merge'?'Can merge':Math.round(b.pct*100)+'%';
    return `<div class="box ${st==='sealed'?'sealed':''} ${st==='merge'?'mergeable':''}" data-open="${esc(b.id)}" style="--i:${ci++}">
      <div class="t"><b>${esc(b.id)}</b><span class="pill ${b.loc==='Overflow'?'off':''}">${esc(b.loc)}</span></div>
      <div class="meter"><i class="${fillClass(b.pct)}" style="width:${Math.min(100,Math.round(b.pct*100))}%"></i></div>
      <div class="meta"><span class="cnt">${b.left} / ${b.cap}</span><span class="state ${st==='sealed'?'sealed':st==='merge'?'merge':'open'}">${st==='sealed'?GL.crest:st==='merge'?GL.holo:GL.flame}${lab}</span></div>
    </div>`; };
  const HALLS=[['Main','The Grand Rotunda','Main location'],['Overflow','The Outer Vaults','Overflow location']];
  const hallsHtml=HALLS.map(([k,title,sub])=>{
    const arr=v.filter(b=>b.loc===k); if(!arr.length) return '';
    return `<section class="hall"><div class="hall-h"><div><div class="hall-t">${title}</div><span class="hall-s">${sub} &middot; ${arr.length} box${arr.length>1?'es':''}</span></div></div><div class="grid">${arr.map(card).join('')}</div></section>`;
  }).join('');
  $('grid').innerHTML = hallsHtml || '<div class="empty">No boxes match.</div>';

  $('ignoredList').textContent=ik.map(k=>`${k} (${ig[k]})`).join(' · ');
  $('boxlist').innerHTML=list.sort((a,b)=>a.series.localeCompare(b.series)||a.num-b.num).map(b=>`<option value="${esc(b.id)}">`).join('');
  runSearch();
}
function runSearch(){
  const q=$('q').value.trim(), p=$('search');
  if(!q){p.hidden=true;return;}
  const hit=effRows().filter(r=>!isPulled(r)&&(r.item===q||r.item.includes(q)&&q.length>=4));
  p.hidden=false;
  if(!hit.length){p.innerHTML=`<div class="sub">Nothing on hand matching “${esc(q)}”.</div>`;return;}
  const by={}; hit.forEach(r=>(by[r.box]=by[r.box]||[]).push(r));
  p.innerHTML=`<h2>“${esc(q)}” is in:</h2>`+Object.keys(by).map(b=>`<div class="sug"><b>${esc(b)}</b><span class="pill ${locOf(b)==='Overflow'?'off':''}">${locOf(b)}</span><span class="sub">${by[b].length} sample${by[b].length>1?'s':''} · item ${[...new Set(by[b].map(r=>r.item))].join(', ')}</span><button data-open="${esc(b)}">Open</button></div>`).join('');
}

/* ---------- box detail ---------- */
function openBox(id){
  curBox=id; dupBy=dupIndex();
  if(boxQBox!==id){ boxQ=''; boxQBox=id; boxSel.clear(); boxHideDel=false; }
  const rowsAll=effRows().filter(r=>r.box===id&&!(state.pulled[r.k]&&state.pulled[r.k].to===COMMIT)).sort(boxCmp);
  const isDelRow=r=>{ const p=state.pulled[r.k]; return !!p&&p.to===DELD; };
  const delCount=rowsAll.filter(isDelRow).length, rows=boxHideDel?rowsAll.filter(r=>!isDelRow(r)):rowsAll;
  const left=rows.filter(r=>!isPulled(r)).length, cap=capOf(id), isFull=left>=cap;
  $('dt').textContent=`${id} — ${left} of ${cap}${isFull?' (FULL)':''}`;
  $('dctl').innerHTML=`<select id="dloc"><option>Main</option><option>Overflow</option></select>
    <label class="sub">capacity <input id="dcap" type="number" min="1" style="width:70px" value="${cap}"></label>
    <button id="drename">Change number</button> <button id="dfull">${meta(id).full&&isFull?'Unmark full':'Mark as full'}</button> <button id="dadd">+ Add sample</button> <button id="ddel" class="danger">Delete box</button>`;
  $('dloc').value=locOf(id);
  $('dloc').onchange=e=>{meta(id).loc=e.target.value;save();opMeta(id);render();};
  $('dcap').onchange=e=>{const n=parseInt(e.target.value,10);if(n>0)meta(id).cap=n;else delete meta(id).cap;save();opMeta(id);render();openBox(id);};
  // Marking full pins this box's capacity at what it holds right now (boxes fill at different counts).
  $('dfull').onclick=()=>{ const m=meta(id); if(m.full&&isFull){delete m.full;delete m.cap;} else {m.full=true;m.cap=Math.max(1,left);} save();opMeta(id);render();openBox(id); };
  $('dadd').onclick=()=>openAdd(id);
  $('ddel').onclick=()=>openDelete(id);
  $('drename').onclick=()=>openMerge([id],id,true);
  const noteCell=r=>{ const n=noteOf(r), k=nkey(r); return n?`<span class="notetxt" title="${esc(n.text)}">${esc(n.text)}</span> <button class="sm" data-noteedit="${esc(k)}">Edit</button>`:`<button class="sm" data-noteedit="${esc(k)}">+ Note</button>`; };
  const note=r=>{
    const p=state.pulled[r.k];
    if(p&&p.to===DELD) return `<span class="pill">deleted</span> <button class="sm" data-restore="${esc(r.k)}">Restore</button>`;
    if(p){ const to=p.to||''; const n=to?normLoc(to):{};
      return `<input data-to="${esc(r.k)}" list="boxlist" value="${esc(to)}" placeholder="Now at: pick a box or type where" style="width:100%;min-width:170px">${to&&!n.box?'<div class="sub">not a box – leaves the boxes</div>':''}`; }
    return dupPill(r)+(r.from?`<span class="pill">moved in from ${esc(r.from)}</span> `:'')+(r.manual?'<span class="pill">manual</span> ':'')+`<button class="danger sm" data-del1="${esc(r.k)}">Delete</button>`;
  };
  $('dbody').innerHTML=`<div class="bsticky"><div class="bsearch"><input id="bsearch" type="search" placeholder="Search this box by product # or note" autocomplete="off" value="${esc(boxQ)}"><span class="sub" id="bcount"></span><select id="bsort" title="Sort this box"><option value="num-asc">Product # low → high</option><option value="num-desc">Product # high → low</option><option value="date-old">Date old → new</option><option value="date-new">Date new → old</option></select>${delCount?`<button id="brefresh" class="sm" title="${boxHideDel?'Show the deleted products again (so you can Restore them)':'Hide the products you deleted, so only the remaining ones show'}">${boxHideDel?'Show '+delCount+' deleted':'Refresh · hide '+delCount+' deleted'}</button><button id="bcommit" class="sm danger" title="Make these deletions final: they will not show in this box again">Commit ${delCount} deleted</button>`:''}</div><div id="bulk" class="bulk" hidden><span id="bulkn"></span><button class="danger" id="bulkdel">Delete selected</button><button id="bulkclr">Clear selection</button></div></div><table><thead><tr><th><input type="checkbox" id="selall" title="Select all shown"></th><th>Pulled</th><th>Item #</th><th>Date</th><th>Location / note</th><th>Note</th></tr></thead><tbody>`+
    rows.map(r=>`<tr class="${isPulled(r)?'pulled':''}" data-item="${esc(r.item||'')}" data-note="${esc((noteOf(r)||{text:''}).text)}"><td class="sel"><input type="checkbox" data-sel="${esc(r.k)}" ${boxSel.has(r.k)?'checked':''} ${isPulled(r)?'disabled':''}></td><td><input type="checkbox" data-pull="${esc(r.k)}" ${isPulled(r)?'checked':''}></td><td>${esc(r.item||'—')}</td><td class="dt">${dateCell(r)} <button class="sm ed" data-dateedit="${esc(nkey(r))}" title="Edit this date">✎</button></td><td class="np">${note(r)}</td><td class="np nt">${noteCell(r)}</td></tr>`).join('')+`</tbody></table>
    <div class="sub" style="margin-top:8px">Tick “Pulled” when a sample leaves this box, then say where it is now (an existing box, a new box you type, or leave blank if it's gone). “Mark as full” sets this box's capacity to what it holds right now.</div>`;
  if(!$('dlg').open) $('dlg').showModal();
  if($('brefresh')) $('brefresh').onclick=()=>{ boxHideDel=!boxHideDel; openBox(id); };
  if($('bcommit')) $('bcommit').onclick=()=>{ const ks=rowsAll.filter(isDelRow).map(r=>r.k);
    if(ks.length&&confirm(`Commit ${ks.length} deletion${ks.length===1?'':'s'} in ${id}?

These products are removed for good: they will not show in this box again and can no longer be restored. (Undo still works until you close or reload the page.)`)){ applyCommit(ks); render(); openBox(id); } };
  $('bsort').value=boxSort; $('bsort').onchange=e=>{ boxSort=e.target.value; try{ localStorage.setItem('sampleBoxTracker.boxSort',boxSort); }catch(err){} openBox(id); };
  const selRows=()=>[...document.querySelectorAll('#dbody tbody tr')].filter(tr=>tr.style.display!=='none').map(tr=>tr.querySelector('[data-sel]')).filter(c=>c&&!c.disabled);
  const updateBulk=()=>{ const live=new Set(rows.filter(r=>!isPulled(r)).map(r=>r.k)); for(const k of [...boxSel]) if(!live.has(k)) boxSel.delete(k);
    $('bulk').hidden=!boxSel.size; $('bulkn').textContent=boxSel.size+' selected'; const vis=selRows(); $('selall').checked=vis.length>0&&vis.every(c=>boxSel.has(c.dataset.sel)); $('dbody').style.setProperty('--stk',document.querySelector('#dbody .bsticky').offsetHeight+'px'); };
  const applyBQ=()=>{ const raw=$('bsearch').value, q=raw.trim().toLowerCase(); boxQ=raw; let n=0,tot=0;
    document.querySelectorAll('#dbody tbody tr').forEach(tr=>{ tot++; const ok=!q||(tr.dataset.item||'').toLowerCase().includes(q)||(tr.dataset.note||'').toLowerCase().includes(q); tr.style.display=ok?'':'none'; if(ok) n++; });
    $('bcount').textContent=q?(n+' of '+tot):''; updateBulk(); };
  $('bsearch').oninput=applyBQ; applyBQ();
  $('dbody').onchange=e=>{

    if(t.id==='selall'){ selRows().forEach(c=>{ c.checked=t.checked; t.checked?boxSel.add(c.dataset.sel):boxSel.delete(c.dataset.sel); }); updateBulk(); return; }
    if(t.dataset.pull!=null){
      if(t.checked){ state.pulled[t.dataset.pull]={from:id,to:'',at:Date.now()}; save(); opPull(t.dataset.pull); } else { delete state.pulled[t.dataset.pull]; save(); op({op:'clearPull',k:t.dataset.pull}); }
      render(); openBox(id);
      if(t.checked){ const i=$('dbody').querySelector(`[data-to="${CSS.escape(t.dataset.pull)}"]`); if(i) i.focus(); }
    } else if(t.dataset.to!=null){
      const p=state.pulled[t.dataset.to]; if(!p) return;
      const v=t.value.trim(), n=normLoc(v); p.to=n.box||v; save(); opPull(t.dataset.to); render(); openBox(id);
    }
  };
  $('dbody').onkeydown=e=>{ if(!e.target.classList||!e.target.classList.contains('noteinp')) return; if(e.key==='Enter'){ e.preventDefault(); const sv=e.target.closest('td').querySelector('[data-notesave]'); if(sv) sv.click(); } else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); openBox(id); } };
  $('dbody').onclick=e=>{ const b=e.target.closest&&e.target.closest('button'); if(!b) return;
    if(b.dataset.noteedit){ const nk=b.dataset.noteedit, td=b.closest('td'), cur=(state.notes[nk]||{}).text||''; td.innerHTML=`<input class="noteinp" maxlength="500" placeholder="Write a note…" value="${esc(cur)}"><span class="noteact"><button class="sm pri" data-notesave="${esc(nk)}">Save</button><button class="sm" data-notecancel="1">Cancel</button>${cur?`<button class="sm danger" data-notedel="${esc(nk)}">Delete</button>`:''}</span>`; td.querySelector('input').focus(); return; }
    if(b.dataset.notesave){ saveNote(b.dataset.notesave,b.closest('td').querySelector('input').value); render(); openBox(id); return; }
    if(b.dataset.notedel){ if(confirm('Delete this note?')){ saveNote(b.dataset.notedel,''); render(); openBox(id); } return; }
    if(b.dataset.notecancel){ openBox(id); return; }
    if(b.id==='bulkdel'){ const ks=[...boxSel]; if(ks.length&&confirm(`Delete ${ks.length} product${ks.length===1?'':'s'} from ${id}?

They disappear for everyone. You can bring each one back with Restore.`)){ const at=Date.now(); ks.forEach(k=>{ state.pulled[k]={from:id,to:DELD,at}; opPull(k); }); boxSel.clear(); save(); render(); openBox(id); } return; }
    if(b.id==='bulkclr'){ boxSel.clear(); document.querySelectorAll('#dbody [data-sel]').forEach(c=>c.checked=false); updateBulk(); return; }
    if(b.dataset.dateedit){ const k=b.dataset.dateedit, td=b.closest('td'), o=state.dates[k], r=rowsAll.find(x=>nkey(x)===k), cur=r&&r.ts?ymd(r.ts):'';
      td.innerHTML=`<input type="date" class="dtinp" value="${cur}" ${o&&o.no?'disabled':''}><label class="sub" style="display:flex;gap:6px;align-items:center;margin:6px 0"><input type="checkbox" class="dtno" ${o&&o.no?'checked':''}> Not original date</label><span class="noteact"><button class="sm pri" data-datesave="${esc(k)}">Save</button><button class="sm" data-notecancel="1">Cancel</button>${o?`<button class="sm" data-datereset="${esc(k)}" title="Go back to the date from the sheet">Reset</button>`:''}</span>`;
      td.querySelector('.dtno').onchange=e=>{ td.querySelector('.dtinp').disabled=e.target.checked; }; return; }
    if(b.dataset.datesave){ const k=b.dataset.datesave, td=b.closest('td'), no=td.querySelector('.dtno').checked, dv=td.querySelector('.dtinp').value, r=rowsAll.find(x=>nkey(x)===k); let ts;
      if(no) ts=(r&&r.ts)||Date.now(); else if(!dv){ toast('Pick a date first, or tick Not original date'); return; } else ts=(dv===ymd(Date.now()))?Date.now():new Date(dv+'T12:00:00').getTime();
      setDateOverride(k,{ts,no}); render(); openBox(id); return; }
    if(b.dataset.datereset){ setDateOverride(b.dataset.datereset,null); render(); openBox(id); return; }
    const k1=b.dataset.del1, kr=b.dataset.restore;
    if(k1){ const r=rows.find(x=>x.k===k1); if(r&&confirm(`Delete product ${r.item||'(no number)'} from ${id}?

It disappears for everyone. You can bring it back with Restore.`)){ state.pulled[k1]={from:id,to:DELD,at:Date.now()}; save(); opPull(k1); render(); openBox(id); } return; }
    if(kr){ delete state.pulled[kr]; save(); op({op:'clearPull',k:kr}); render(); openBox(id); } };
}

function openAdd(preBox){
  const fromBox=curBox;            // the box window the user was in (if any): we return there afterwards
  curBox=null;
  $('dt').textContent='Add products'; $('dctl').innerHTML=''; $('dbody').onchange=null; $('dbody').onclick=null;
  $('dbody').innerHTML=`<p><label>Box<br><input id="abox" list="boxlist" value="${esc(preBox||'')}" placeholder="pick a box or type a new one, e.g. Box 42"></label></p>
    <p><label>Product #s <span class="sub">(one or many: one per line, or separated by commas or spaces)</span><br>
      <textarea id="aitem" rows="6" inputmode="numeric" placeholder="115403&#10;115404&#10;115405" style="width:100%;font-family:var(--mono);overflow-x:hidden;resize:vertical"></textarea></label>
      <span id="acount" class="sub"></span></p>
    <p><label>Date added to the box<br><input id="adate" type="date" value="${ymd(Date.now())}"></label><br>
      <label style="display:inline-flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" id="anoorig"> <span>Not the original date <span class="sub">(don't know when they were first put in this box)</span></span></label></p>
    <p id="amsg" class="sub" style="color:var(--danger)"></p>
    <p style="display:flex;gap:10px;flex-wrap:wrap"><button class="pri" id="asave">Add to box</button><button id="aback">${fromBox?'Back to '+esc(fromBox):'Cancel'}</button></p>
    <div class="sub">Entries added here are shared with everyone and stay when you re-import the sheet. If you later add the same product to the Google Sheet, delete the manual copy here so it is not counted twice.</div>`;
  if(!$('dlg').open) $('dlg').showModal();

  let add=0,rm=0; for(const k in (before.manual||{})){ if(now.manual[k]!==undefined) add++; else rm++; }
  if(add) P.push('Added '+add+' sample'+(add>1?'s':'')); if(rm) P.push('Removed '+rm+' manual sample'+(rm>1?'s':''));
  for(const g in (before.moves||{})){ const a=now.moves[g]; if(a===undefined) P.push('Undid a box change'); else { const mv=JSON.parse(a); P.push(mv[0].to===DEL?'Deleted a box':mv.length>1?'Merged boxes':'Renumbered a box'); } }
  const dd=Object.keys(before.dates||{}).length; if(dd) P.push(dd>1?'Changed '+dd+' dates':'Changed a date');
  const nn=Object.keys(before.notes||{}).length; if(nn) P.push(nn>1?'Changed '+nn+' notes':'Changed a note');
  const dm=Object.keys(before.dismissed||{}).length; if(dm) P.push('Reviewed duplicates');
  if(before.boxMeta) P.push('Changed box settings'); if('cap' in before) P.push('Changed default capacity');
  return P.slice(0,3).join(', ')||'Change';
}
function undoCommit(){
  commitT=0; if(!undoReady||undoing||!lastSnap) return;
  const now=undoMaps(), before={}; let any=false;
  for(const sl of UNDO_SL){ const a=lastSnap[sl], b=now[sl], ch={};
    new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{ if(a[k]!==b[k]) ch[k]=a[k]===undefined?null:a[k]; });
    if(Object.keys(ch).length){ before[sl]=ch; any=true; } }
  if(lastSnap.cap!==now.cap){ before.cap=lastSnap.cap; any=true; }
  if(any){ redoStack.length=0; undoStack.push({before,label:undoLabel(before,now)}); if(undoStack.length>30) undoStack.shift(); }
  lastSnap=now; undoUI();
}
function undoUI(){
  const u=undoStack[undoStack.length-1], t=u?'Undo: '+u.label:'Nothing to undo yet';
  ['undoBtn','dundoBtn'].forEach(id=>{ const b=document.getElementById(id); if(b){ b.disabled=!u; b.title=t; } });
  const r=redoStack[redoStack.length-1], rt=r?'Redo: '+r.label:'Nothing to redo';
  ['redoBtn','dredoBtn'].forEach(id=>{ const b=document.getElementById(id); if(b){ b.disabled=!r; b.title=rt; } });
}
let toastT=0;
function toast(msg){ const t=$('toast'); t.textContent=msg; try{ if(t.matches(':popover-open')) t.hidePopover(); t.showPopover(); }catch(e){} t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>{ try{ t.hidePopover(); }catch(e){} },350); },3800); }
function undoInvert(u){
  const now=undoMaps(), inv={};
  for(const sl of UNDO_SL){ if(u.before[sl]){ inv[sl]={}; for(const k in u.before[sl]) inv[sl][k]=now[sl][k]===undefined?null:now[sl][k]; } }
  if('cap' in u.before) inv.cap=now.cap;
  return {before:inv,label:u.label};
}
function undoApply(u){
  undoing=true;
  try{
    const b=u.before;
    for(const k in (b.pulled||{})){ const v=b.pulled[k]; if(v===null){ delete state.pulled[k]; op({op:'clearPull',k}); } else { state.pulled[k]=JSON.parse(v); opPull(k); } }
    for(const k in (b.manual||{})){ const v=b.manual[k]; state.manual=state.manual.filter(m=>m.k!==k); if(v===null) op({op:'delManual',k}); else { const e=JSON.parse(v); state.manual.push(e); op({op:'addManual',entry:e}); } }
    for(const box in (b.boxMeta||{})){ const v=b.boxMeta[box]; if(v===null) delete state.boxMeta[box]; else state.boxMeta[box]=JSON.parse(v); opMeta(box); }
    for(const k in (b.dates||{})){ const v=b.dates[k]; if(v===null){ delete state.dates[k]; if(serverDates) op({op:'delDate',k}); } else { const d=JSON.parse(v); state.dates[k]=d; if(serverDates) op({op:'setDate',k,ts:d.ts,no:d.no?1:0}); } }
    for(const k in (b.notes||{})){ const v=b.notes[k]; if(v===null){ delete state.notes[k]; if(serverNotes) op({op:'delNote',k}); } else { const n=JSON.parse(v); state.notes[k]=n; if(serverNotes) op({op:'setNote',k,text:n.text,at:n.at}); } }
    for(const k in (b.dismissed||{})){ const v=b.dismissed[k]; if(v===null){ delete state.dismissed[k]; if(serverDismiss) op({op:'undismissDup',item:k}); } else { const d=JSON.parse(v); state.dismissed[k]=d; if(serverDismiss) op({op:'dismissDup',item:k,at:d.at,n:d.n}); } }
    for(const g in (b.moves||{})){ const v=b.moves[g]; state.moves=state.moves.filter(m=>m.g!==g); if(v===null) op({op:'delMoves',g}); else JSON.parse(v).forEach(m=>{ state.moves.push(m); op({op:'addMove',move:m}); }); }
    state.moves.sort((x,y)=>x.at-y.at);
    if('cap' in b){ state.cap=b.cap; op({op:'setCap',cap:b.cap}); }
    save();
  } finally { undoing=false; }
  undoSync();
}
function undoAfter(msg){
  render();
  if($('dlg').open){ if(curBox) openBox(curBox); else if($('dt').textContent==='Duplicate products') openDupes(); }
  undoUI(); toast(msg);
}
function undoLast(){ const u=undoStack.pop(); if(!u) return; const inv=undoInvert(u); undoApply(u); redoStack.push(inv); undoAfter('Undone: '+u.label); }
function redoLast(){ const r=redoStack.pop(); if(!r) return; const inv=undoInvert(r); undoApply(r); undoStack.push(inv); undoAfter('Redone: '+r.label); }
$('undoBtn').onclick=undoLast; $('dundoBtn').onclick=undoLast; $('redoBtn').onclick=redoLast; $('dredoBtn').onclick=redoLast;
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&['z','y'].includes(e.key.toLowerCase())){
    const t=e.target, tag=(t&&t.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable)) return;
    const redo=e.key.toLowerCase()==='y'||e.shiftKey;
    if(redo?redoStack.length:undoStack.length){ e.preventDefault(); redo?redoLast():undoLast(); }
  }
});
undoReady=true; undoSync(); undoUI();

function applyCommit(keys){ keys.forEach(k=>{ const p=state.pulled[k]; if(p&&p.to===DELD){ state.pulled[k]=Object.assign({},p,{to:COMMIT}); opPull(k); } }); save(); }

/* ---------- help / FAQ (English + simple Spanish) ---------- */
const HELP={
 en:{title:'Help / FAQ',items:[
  ['What is this app for?','It shows which box each internal color / CAD reference sample is in, how full every box is, and which boxes can be combined. Everyone who opens this page sees the same data.'],
  ['How do I read a box card?','The name is the box. “74 / 100” means 74 samples are in it and it holds 100. A glowing <b>flame</b> means there is still room (with how full it is). A pulsing <b>blue ring</b> means it can be merged with another box. A bronze <b>crest</b> means FULL. Boxes are grouped as “The Grand Rotunda” (Main location) and “The Outer Vaults” (Overflow). Tap a card to see what is inside.'],
  ['How do I find where a sample is?','Type the product # (item #) in the search bar at the top. It lists every box that has that sample. Tap Open to see it. Inside a box window you can also sort the list by product number or date. Inside a box window, use its own search field to find a product in that box.'],
  ['A sample leaves a box (CSR / sales request)','Open the box, tick <b>Pulled</b> on that sample, then in “Now at” pick the box it went to, or type where it is now (for example “Box 12”). If it is gone for good, leave it blank. The count in both boxes updates for everyone.'],
  ['I tapped Pulled by mistake','Untick it. The sample goes back into the box.'],
  ['How do I mark a box as full?','Open the box and tap <b>Mark as full</b>. The app remembers that this box is full at today’s count, so boxes with bigger samples can be “full” at fewer samples. Tap <b>Unmark full</b> to undo.'],
  ['How do I change the date of a product?','Open the box and tap the small <b>✎</b> next to the product’s date. Pick the new date, or tick <b>Not original date</b> if you do not know when it was first put in the box, then tap <b>Save</b>. <b>Reset</b> goes back to the date from the sheet. The change is shared with everyone and can be undone.'],
  ['How do I add a sample by hand?','Tap <b>+ Add sample</b> (top, or inside a box). Pick or type the box, enter the product # (item #), then tap Add to box. You can add several in a row. To remove one you added by mistake, open the box and tap the ✕ next to it. If you do not know when it was first put in the box, tick <b>Not the original date</b>: the list then shows “Not original date” instead of a date. You can add many at once: type or paste several product numbers (one per line, or separated by commas or spaces) and they all go into the box together. When you finish you land back in that same box.'],
  ['How do I combine (merge) boxes?','Tap <b>Merge / renumber boxes</b> (or <b>Merge…</b> on a suggestion). Tick the boxes to combine, type the box number the finished box should have (one of them or a brand-new number), check the capacity, then tap Apply. Move the samples physically too. Made a mistake? Settings → Recent box changes → Undo.'],
  ['How do I change a box number?','Open the box and tap <b>Change number</b>, type the new number and Apply. All its samples move with it. Typing the number of another existing box merges them. You can undo it in Settings.'],
  ['How do I undo my last change?','Tap <b>Undo</b> (top right, or in any box window) or press <b>Ctrl+Z</b>. It reverses your last change: a delete, pull, merge, note, mark full, and so on. Tap again to go back further (up to 30 steps while the page stays open). It only undoes <b>your own</b> changes on this device, and it cannot undo importing a new sheet. Changed your mind about an undo? Tap <b>Redo</b> (or Ctrl+Y) to put it back. Starting a new change clears the redo history.'],
  ['What is “Sheet changes”? (TEST version)','On the TEST version, your box changes (renumber, merge, delete, pull) are a draft. Tap <b>Sheet changes</b> to see exactly which Sample Location cells would change, then tap <b>Write … to the Google Sheet</b> (it asks for the write passphrase and for confirmation). Only the Sample Location column is ever changed, each old value is saved, and <b>Revert</b> undoes a whole batch.'],
  ['How do I delete a box?','Open the box and tap <b>Delete box</b>. The app asks “Are you sure?” and tells you how many samples are in it. Tap <b>Yes, delete</b> to confirm. The box disappears for everyone. Changed your mind? Settings → Recent box changes → Undo. To keep the samples, merge the box into another one instead.'],
  ['How do I delete one product from a box?','Open the box, find the product (the box has its own search field), and tap <b>Delete</b> on its row. The app asks “Are you sure?”. The product disappears for everyone. Changed your mind? Tap <b>Restore</b> on that row. Use <b>Pulled</b> instead when the product moved to another box. To delete many at once, tick the boxes in the first column (the top box selects everything shown) and tap <b>Delete selected</b>. After deleting, tap <b>Refresh</b> in the box window to hide the deleted products and see only what is left (tap <b>Show deleted</b> to bring the list back). When you are sure, tap <b>Commit N deleted</b> to make the deletions final: those products will not show in that box again and cannot be restored. (Settings has <b>Commit all deletions</b> for every box at once.)'],
  ['How do I add a note to a product?','Open the box and tap <b>+ Note</b> on the product’s row, type your note and tap <b>Save</b> (or press Enter). Tap <b>Edit</b> to change it, or <b>Delete</b> inside the editor to remove it. Notes are shared with everyone, the box search also finds words inside notes, and the Excel export includes them. A note stays with that sample even if you move it to another box.'],
  ['How do I find and clean up duplicate products?','Tap <b>Review duplicates</b> (or the “duplicate products” number at the top). Each entry is one product that is on hand more than once. For each one you can: <b>Keep only in [box]</b> (removes it from the other boxes, after asking), <b>Remove</b> one sample, <b>Open box</b>, or <b>Mark reviewed</b> if you want to keep them all (it comes back only if another copy is added). Use the filter to see just products in different boxes or several in one box. Inside any box, a gold “also in Box X” tag shows its duplicates. <b>Export to Excel</b> downloads the list you are looking at. Nothing changes until you press a button.'],
  ['How do I update the data from the Google Sheet?','Copy the same 4 columns from the sheet as always into an Excel file, then drag it onto the dotted box at the top (or tap it to choose the file). The app only reads those columns and ignores everything else. It asks you to confirm because it <b>replaces the data for everyone</b>. Pulls and manual entries are kept.'],
  ['Some entries are missing','Only locations that look like a box (Box 12, Bx12, Calchef 2…) are counted. Things like “Given to Johana” or “1st pass” are ignored. See the line “Location entries ignored” at the bottom. Typing “Box 12” the same way every time works best.'],
  ['What does “Offline – changes waiting” mean?','Your phone or PC lost the connection. Your changes are saved on the device and will send automatically when it is back. Keep the page open until it says “synced”.'],
  ['What are Main and Overflow?','Where the box is kept. Set it inside the box window. Use the filter at the top to see only one location.'],
  ['How do I get the newest version of the app?','Tap <b>Update</b> at the top. It sends any unsent changes, clears the old copy stored on your device and reloads the latest version. Your data is not affected.']
 ]},
 es:{title:'Ayuda / Preguntas',items:[
  ['¿Para qué sirve esta app?','Muestra en qué caja está cada muestra de referencia (color / CAD), qué tan llena está cada caja y qué cajas se pueden juntar. Todos ven los mismos datos.'],
  ['¿Cómo leo la tarjeta de una caja?','El nombre es la caja. “74 / 100” = hay 74 muestras y caben 100. Una <b>llama</b> brillante = todavía hay espacio (y qué tan llena está). Un <b>anillo azul</b> que pulsa = se puede juntar con otra caja. Un <b>escudo</b> de bronce = llena (FULL). Las cajas están agrupadas en “The Grand Rotunda” (Main) y “The Outer Vaults” (Overflow). Toca la tarjeta para ver lo que tiene.'],
  ['¿Cómo encuentro una muestra?','Escribe el número de producto (artículo) en la barra de búsqueda. Te dice en qué caja(s) está. Toca Open para verla. Dentro de una caja, usa su propio campo de búsqueda para encontrar un producto en esa caja. También puedes ordenar por número de producto o por fecha.'],
  ['Sacan una muestra de una caja','Abre la caja, marca <b>Pulled</b> en esa muestra y en “Now at” elige la caja a donde fue, o escribe dónde está (por ejemplo “Box 12”). Si ya no existe, déjalo vacío. Los conteos se actualizan para todos.'],
  ['Marqué Pulled por error','Quita la marca. La muestra vuelve a la caja.'],
  ['¿Cómo marco una caja como llena?','Abre la caja y toca <b>Mark as full</b>. La app recuerda que esa caja está llena con el número de hoy (las cajas con muestras grandes se llenan con menos). Toca <b>Unmark full</b> para deshacer.'],
  ['¿Cómo cambio la fecha de un producto?','Abre la caja y toca el pequeño <b>✎</b> junto a la fecha del producto. Elige la fecha nueva, o marca <b>Not original date</b> si no sabes cuándo se puso por primera vez en la caja, y toca <b>Save</b>. <b>Reset</b> vuelve a la fecha de la hoja. El cambio lo ve todo el mundo y se puede deshacer.'],
  ['¿Cómo agrego una muestra a mano?','Toca <b>+ Add sample</b>. Elige o escribe la caja, el número de producto (artículo) y toca Add to box. Para borrar una que agregaste por error, abre la caja y toca la ✕. Si no sabes cuándo se puso por primera vez en la caja, marca <b>Not the original date</b>: la lista mostrará “Not original date” en vez de una fecha. Puedes agregar varios a la vez: escribe o pega varios números de producto (uno por línea, o separados por comas o espacios) y todos entran a la caja juntos. Al terminar regresas a esa misma caja.'],
  ['¿Cómo junto (combino) cajas?','Toca <b>Merge / renumber boxes</b> (o <b>Merge…</b> en una sugerencia). Marca las cajas, escribe el número que tendrá la caja final (uno de ellos o uno nuevo), revisa la capacidad y toca Apply. Mueve también las muestras físicamente. ¿Error? Settings → Recent box changes → Undo.'],
  ['¿Cómo cambio el número de una caja?','Abre la caja y toca <b>Change number</b>, escribe el número nuevo y Apply. Todas sus muestras se van con ella. Si escribes el número de otra caja, se juntan. Se puede deshacer en Settings.'],
  ['¿Cómo deshago mi último cambio?','Toca <b>Undo</b> (arriba a la derecha, o en la ventana de cualquier caja) o presiona <b>Ctrl+Z</b>. Revierte tu último cambio: borrar, pull, juntar cajas, nota, marcar llena, etc. Toca otra vez para retroceder más (hasta 30 pasos mientras la página siga abierta). Solo deshace <b>tus propios</b> cambios en este dispositivo y no puede deshacer la importación de una hoja nueva. ¿Te arrepentiste de deshacer? Toca <b>Redo</b> (o Ctrl+Y) para volver a hacerlo. Un cambio nuevo borra el historial de rehacer.'],
  ['¿Qué es “Sheet changes”? (versión TEST)','En la versión TEST, tus cambios de cajas (renumerar, juntar, borrar, mover) son un borrador. Toca <b>Sheet changes</b> para ver qué celdas de Sample Location cambiarían y luego <b>Write … to the Google Sheet</b> (pide la contraseña y una confirmación). Solo se cambia la columna Sample Location, cada valor anterior se guarda y <b>Revert</b> deshace todo un lote.'],
  ['¿Cómo borro una caja?','Abre la caja y toca <b>Delete box</b>. La app pregunta “¿Estás seguro?” y dice cuántas muestras tiene. Toca <b>Yes, delete</b> para confirmar. La caja desaparece para todos. ¿Te arrepentiste? Settings → Recent box changes → Undo. Para conservar las muestras, junta la caja con otra.'],
  ['¿Cómo borro un solo producto de una caja?','Abre la caja, busca el producto (la caja tiene su propio campo de búsqueda) y toca <b>Delete</b> en su fila. La app pregunta “¿Estás seguro?”. El producto desaparece para todos. ¿Te arrepentiste? Toca <b>Restore</b> en esa fila. Usa <b>Pulled</b> cuando el producto se movió a otra caja. Para borrar varios a la vez, marca las casillas de la primera columna (la de arriba selecciona todo lo que se ve) y toca <b>Delete selected</b>. Después de borrar, toca <b>Refresh</b> en la ventana de la caja para ocultar los productos borrados y ver solo los que quedan (toca <b>Show deleted</b> para verlos otra vez). Cuando estés seguro, toca <b>Commit N deleted</b> para dejar los borrados como definitivos: esos productos no volverán a aparecer en esa caja y no se pueden restaurar. (En Settings, <b>Commit all deletions</b> lo hace para todas las cajas.)'],
  ['¿Cómo agrego una nota a un producto?','Abre la caja y toca <b>+ Note</b> en la fila del producto, escribe tu nota y toca <b>Save</b> (o presiona Enter). Toca <b>Edit</b> para cambiarla o <b>Delete</b> dentro del editor para quitarla. Las notas las ve todo el mundo, la búsqueda de la caja también encuentra palabras de las notas y el Excel las incluye. La nota se queda con esa muestra aunque la muevas a otra caja.'],
  ['¿Cómo encuentro y limpio productos duplicados?','Toca <b>Review duplicates</b> (o el número “duplicate products” arriba). Cada entrada es un producto que está más de una vez. Puedes: <b>Keep only in [caja]</b> (lo quita de las otras cajas, después de preguntar), <b>Remove</b> una muestra, <b>Open box</b>, o <b>Mark reviewed</b> si quieres dejarlos todos. El filtro muestra solo los de cajas distintas o varios en una caja. Dentro de una caja, la etiqueta dorada “also in Box X” muestra sus duplicados. <b>Export to Excel</b> descarga la lista que estás viendo. Nada cambia hasta que toques un botón.'],
  ['¿Cómo actualizo los datos?','Copia las mismas 4 columnas de siempre a un archivo de Excel y arrástralo al cuadro punteado de arriba. La app solo lee esas columnas. Te pide confirmar porque <b>cambia los datos para todos</b>. Los Pulled y las muestras manuales se conservan.'],
  ['Faltan algunas entradas','Solo se cuentan ubicaciones que parecen una caja (Box 12, Bx12, Calchef 2…). “Given to Johana” o “1st pass” se ignoran (ver abajo “Location entries ignored”). Escribe “Box 12” siempre igual.'],
  ['¿Qué significa “Offline – changes waiting”?','Se perdió la conexión. Tus cambios están guardados y se envían solos cuando regrese. Deja la página abierta hasta que diga “synced”.'],
  ['¿Qué son Main y Overflow?','Dónde está guardada la caja. Se cambia dentro de la ventana de la caja. Usa el filtro de arriba para ver un solo lugar.'],
  ['¿Cómo obtengo la versión más nueva?','Toca <b>Update</b> arriba. Envía los cambios pendientes, borra la copia vieja del dispositivo y carga la versión más reciente. Tus datos no se pierden.']
 ]}
};

document.addEventListener('pointermove',e=>{ lastP=e; if(rafP) return; rafP=requestAnimationFrame(()=>{ rafP=0; const ev=lastP, c=ev.target.closest&&ev.target.closest('.box'); if(!c) return; const r=c.getBoundingClientRect(); c.style.setProperty('--mx',(ev.clientX-r.left)+'px'); c.style.setProperty('--my',(ev.clientY-r.top)+'px'); }); },{passive:true});

/* ---------- wiring ---------- */
// Update = hard refresh: send unsent changes, drop cached copies, reload with a fresh URL so the newest files are fetched
async function hardRefresh(){
  const b=$('updateBtn'); b.disabled=true; b.querySelector('.lbl').textContent='Updating…';
  try{ await flush(); }catch(e){}
  try{ if(window.caches){ for(const k of await caches.keys()) await caches.delete(k); } }catch(e){}
  try{ if(navigator.serviceWorker){ for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } }catch(e){}
  const u=new URL(location.href); u.searchParams.set('v',Date.now()); location.replace(u.toString());
}
$('updateBtn').onclick=hardRefresh;
try{ const cu=new URL(location.href); if(cu.searchParams.has('v')){ cu.searchParams.delete('v'); history.replaceState(null,'',cu.pathname+cu.search+cu.hash); } }catch(e){}
$('helpBtn').onclick=openHelp;
$('dlg').addEventListener('close',()=>{ boxQBox=null; boxSel.clear(); boxHideDel=false; });
const drop=$('drop'), fi=$('file');
drop.onclick=()=>fi.click();
fi.onchange=()=>fi.files[0]&&readFile(fi.files[0]);
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0]; if(f) readFile(f);});
window.addEventListener('dragover',e=>e.preventDefault()); window.addEventListener('drop',e=>{e.preventDefault(); if(e.target!==drop&&!drop.contains(e.target)){const f=e.dataTransfer.files[0]; if(f) readFile(f);}});
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]'); if(o) openBox(o.dataset.open); const m=e.target.closest('[data-merge]'); if(m){ const [a,b]=m.dataset.merge.split('|'); openMerge([a,b],b); }});
