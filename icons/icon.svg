<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2016"/><stop offset="1" stop-color="#120e0a"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="22%" r="55%"><stop offset="0" stop-color="#f0c674" stop-opacity=".38"/><stop offset="1" stop-color="#f0c674" stop-opacity="0"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5532"/><stop offset=".55" stop-color="#5a3d22"/><stop offset="1" stop-color="#432d19"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc9b"/><stop offset=".5" stop-color="#c99a45"/><stop offset="1" stop-color="#8d6628"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3df"/><stop offset="1" stop-color="#eadcba"/></linearGradient>
    <radialGradient id="led" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff3c9"/><stop offset=".45" stop-color="#ffc857"/><stop offset="1" stop-color="#ffc857" stop-opacity="0"/></radialGradient>
    <symbol id="drawer" viewBox="0 0 300 118">
      <rect x="0" y="0" width="300" height="118" rx="16" fill="url(#wood)"/>
      <rect x="0.75" y="0.75" width="298.5" height="116.5" rx="15.5" fill="none" stroke="#e9c477" stroke-opacity=".55" stroke-width="1.5"/>
      <rect x="12" y="10" width="276" height="98" rx="10" fill="none" stroke="#2c1c0e" stroke-opacity=".55" stroke-width="2"/>
      <rect x="12" y="10" width="276" height="98" rx="10" fill="none" stroke="#f3d596" stroke-opacity=".16" stroke-width="1" transform="translate(0 1.5)"/>
      <!-- label plate -->
      <rect x="100" y="20" width="100" height="40" rx="7" fill="url(#brass)"/>
      <rect x="105" y="25" width="90" height="30" rx="4" fill="url(#paper)"/>
      <rect x="114" y="33" width="46" height="4" rx="2" fill="#5a3d22" opacity=".85"/>
      <rect x="114" y="42" width="30" height="3.5" rx="1.75" fill="#5a3d22" opacity=".45"/>
      <circle cx="178" cy="40" r="9" fill="url(#led)"/>
      <circle cx="178" cy="40" r="3" fill="#fff3c9"/>
      <!-- pull -->
      <rect x="118" y="78" width="64" height="14" rx="7" fill="url(#brass)"/>
      <rect x="124" y="80" width="52" height="3" rx="1.5" fill="#fff4d0" opacity=".7"/>
      <rect x="118" y="90" width="64" height="3" rx="1.5" fill="#000" opacity=".25"/>
    </symbol>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#e9c477" stroke-opacity=".35" stroke-width="2"/>
  <!-- small guiding star -->
  <path d="M256 66 L263 90 L287 97 L263 104 L256 128 L249 104 L225 97 L249 90 Z" fill="url(#brass)"/>
  <!-- two stacked catalogue drawers -->
  <use href="#drawer" x="106" y="150" width="300" height="118"/>
  <use href="#drawer" x="106" y="284" width="300" height="118"/>
  <!-- soft floor shadow -->
  <ellipse cx="256" cy="424" rx="130" ry="9" fill="#000" opacity=".35"/>
</svg>
